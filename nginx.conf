server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;
    gzip_min_length 512;

    # Nur fuer .webmanifest den MIME-Typ setzen. WICHTIG: kein globaler types{}-Block
    # im server-Kontext — der wuerde nginx' komplette mime.types-Tabelle ersetzen
    # und alles als application/octet-stream ausliefern.
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    # Hub-Seite und Spieleliste nie cachen -> neue Spiele erscheinen sofort
    location = /            { add_header Cache-Control "no-store" always; try_files /index.html =404; }
    location = /index.html  { add_header Cache-Control "no-store" always; }
    location = /games.json  { add_header Cache-Control "no-store" always; }

    # Service-Worker nie cachen, sonst bleibt eine alte Spielversion kleben
    location ~* /sw\.js$    { add_header Cache-Control "no-store" always; }

    # Jedes Spiel bekommt automatisch eine Zurueck-zum-Hub-Schaltflaeche eingeblendet,
    # ohne dass der Spiel-Quellcode angefasst werden muss.
    location /games/ {
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<a href="/" id="arcade-back" title="Zurueck zur Arcade" style="position:fixed;top:8px;left:8px;z-index:2147483000;display:flex;align-items:center;gap:6px;padding:7px 12px 7px 9px;border-radius:99px;background:rgba(8,20,26,.74);border:1px solid rgba(120,224,210,.32);color:#9fd8ce;font:600 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;opacity:.45;transition:opacity .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.45">&#9666; Arcade</a></body>';

        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log off;
}
