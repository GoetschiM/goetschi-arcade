server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /internal/auth/check {
        internal;
        proxy_pass http://127.0.0.1:3000/internal/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Cookie $http_cookie;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_set_header Cookie $http_cookie;
    }
    location /games/blockfront/ {
        auth_request /internal/auth/check;
        error_page 401 =302 /auth/login?next=$request_uri;
        proxy_pass http://blockfront:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location /games/ {
        auth_request /internal/auth/check;
        error_page 401 =302 /auth/login?next=$request_uri;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<a href="/" id="arcade-back" title="Zurueck zur Arcade" style="position:fixed;top:8px;left:8px;z-index:2147483000;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(8,20,26,.74);color:#9fd8ce;font:600 11px system-ui;text-decoration:none">◄ Arcade</a></body>';
        try_files $uri $uri/ $uri/index.html =404;
    }
    location / {
        auth_request /internal/auth/check;
        error_page 401 =302 /auth/login?next=$request_uri;
        error_page 403 =403 /denied.html;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}