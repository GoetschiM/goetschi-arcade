<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Limbo — Schattenwelt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: #050507;
      color: #e0e0e0;
      font-family: 'Georgia', serif;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    /* Minimalist Film-Grain / Atmospheric Noise */
    .film-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 5;
    }

    /* Cinematic Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 100px 30px rgba(0, 0, 0, 0.85), inset 0 0 240px 100px rgba(0, 0, 0, 0.6);
      z-index: 6;
    }

    /* Top HUD / Controls Info */
    .hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .chapter-tag {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }

    .hud-actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-btn {
      background: rgba(20, 20, 24, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      font-size: 15px;
    }

    .icon-btn:hover, .icon-btn:active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.5);
    }

    /* Floating Touch Controls (Mobile) */
    .touch-zone {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
    }

    .stick-area {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 48%;
      pointer-events: auto;
      touch-action: none;
    }

    .virtual-stick {
      position: absolute;
      width: 120px;
      height: 120px;
      margin-left: -60px;
      margin-top: -60px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.45) 80%);
      backdrop-filter: blur(4px);
      pointer-events: none;
      display: none;
    }

    .virtual-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.45);
    }

    /* Right Action Touch Buttons */
    .action-buttons {
      position: absolute;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      gap: 16px;
      pointer-events: auto;
      align-items: flex-end;
    }

    .touch-btn {
      width: 74px;
      height: 74px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(32, 32, 38, 0.8) 0%, rgba(10, 10, 12, 0.92) 100%);
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      font-weight: bold;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      touch-action: manipulation;
      transition: transform 0.08s ease, border-color 0.12s ease;
    }

    .touch-btn:active, .touch-btn.active {
      transform: scale(0.92);
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.5);
    }

    .touch-btn .btn-icon {
      font-size: 22px;
      line-height: 1;
    }

    .touch-btn--grab {
      width: 66px;
      height: 66px;
      margin-bottom: 20px;
    }

    /* In-Game Cinematic Story Subtitles / Prompts */
    .prompt-banner {
      position: absolute;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 16px));
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 15;
      text-align: center;
      transition: opacity 0.5s ease;
      max-width: 85%;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Start / Death / Chapter Modal Overlay */
    .cinematic-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 25;
      backdrop-filter: blur(12px);
      transition: opacity 0.6s ease;
    }

    .title-box {
      text-align: center;
      max-width: 520px;
      padding: 24px;
    }

    .title-logo {
      font-size: clamp(48px, 9vw, 76px);
      font-weight: 700;
      letter-spacing: 0.35em;
      color: #f2f2f2;
      margin-bottom: 6px;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.35);
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 0.3em;
      color: #7d828a;
      text-transform: uppercase;
      margin-bottom: 30px;
      font-family: 'Courier New', monospace;
    }

    .story-desc {
      font-size: 15px;
      line-height: 1.7;
      color: #9ea3ab;
      margin-bottom: 36px;
      font-style: italic;
    }

    .start-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      padding: 14px 42px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      border-radius: 4px;
    }

    .start-btn:hover, .start-btn:active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="film-grain"></div>
    <div class="vignette"></div>

    <div class="hud">
      <div class="chapter-tag" id="chapterTag">KAPITEL I · IM SCHATTENWALD</div>
      <div class="hud-actions">
        <button class="icon-btn" id="fsToggle" title="Vollbild">⛶</button>
        <button class="icon-btn" id="audioToggle" title="Audio ein/aus">🔊</button>
        <button class="icon-btn" id="restartBtn" title="Kapitel neu starten">↺</button>
      </div>
    </div>

    <!-- Mobile Virtual Touch Controls -->
    <div class="touch-zone" id="touchControls">
      <div class="stick-area" id="stickArea">
        <div class="virtual-stick" id="virtualStick">
          <div class="virtual-knob" id="virtualKnob"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="touch-btn touch-btn--grab" id="grabBtn">
          <span class="btn-icon">✊</span>
          <span>GREIFEN</span>
        </button>
        <button class="touch-btn" id="jumpBtn">
          <span class="btn-icon">▲</span>
          <span>SPRUNG</span>
        </button>
      </div>
    </div>

    <div class="prompt-banner" id="promptBanner">Drücke [A / D] oder Wische zum Laufen</div>

    <!-- Cinematic Start / Chapter Screen -->
    <div class="cinematic-overlay" id="cinematicOverlay">
      <div class="title-box">
        <div class="title-logo">LIMBO</div>
        <div class="subtitle">Schattenwelt der Stille</div>
        <p class="story-desc">
          Ein Junge erwacht im kalten Moos eines düsteren Waldes. Versteckte Fallen lauern in den Baumkronen, gigantische Schatten spionieren aus der Finsternis …
        </p>
        <button class="start-btn" id="startBtn">In die Finsternis ⛶</button>
      </div>
    </div>
  </div>

  <script src="/goetschi-ai-pilot.js"></script>
  <script>
    /* ==========================================================================
       LIMBO: SCHATTENWELT — GAME ENGINE & CINEMATIC RENDERER
       ========================================================================== */
    (() => {
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const promptBanner = document.getElementById('promptBanner');
      const cinematicOverlay = document.getElementById('cinematicOverlay');
      const startBtn = document.getElementById('startBtn');
      const fsToggle = document.getElementById('fsToggle');
      const audioToggle = document.getElementById('audioToggle');
      const restartBtn = document.getElementById('restartBtn');
      const chapterTag = document.getElementById('chapterTag');

      // Virtual Stick Elements
      const stickArea = document.getElementById('stickArea');
      const virtualStick = document.getElementById('virtualStick');
      const virtualKnob = document.getElementById('virtualKnob');
      const jumpBtn = document.getElementById('jumpBtn');
      const grabBtn = document.getElementById('grabBtn');

      /* ==========================================================================
         RESPONSIVE FULLSCREEN VIEWPORT SYSTEM (EDGE-TO-EDGE, NO BLACK BARS)
         ========================================================================== */
      const VH = 720; // Fixed virtual height for physics consistency
      let VW = 1280;  // Dynamically expands with screen aspect ratio
      let scale = 1;

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        scale = canvas.height / VH;
        VW = canvas.width / scale; // Screen-edge to screen-edge without any letterboxing
      }
      window.addEventListener('resize', resize);
      window.addEventListener('orientationchange', () => setTimeout(resize, 100));
      resize();

      function toggleFullscreen() {
        const doc = document;
        const elem = document.documentElement;
        if (!doc.fullscreenElement && !doc.webkitFullscreenElement && !doc.mozFullScreenElement) {
          if (elem.requestFullscreen) elem.requestFullscreen();
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
          else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
        } else {
          if (doc.exitFullscreen) doc.exitFullscreen();
          else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
        }
      }
      fsToggle.addEventListener('click', toggleFullscreen);

      /* ==========================================================================
         WEB AUDIO PROCEDURAL SYNTHESIZER (DARK AMBIENT & FOLEY)
         ========================================================================== */
      let audioCtx = null;
      let soundEnabled = true;
      let ambientGain = null;

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (audioCtx && !ambientGain) {
          startAmbientDrone();
        }
      }

      function startAmbientDrone() {
        if (!audioCtx) return;
        ambientGain = audioCtx.createGain();
        ambientGain.gain.setValueAtTime(0.24, audioCtx.currentTime);
        ambientGain.connect(audioCtx.destination);

        // Sub-bass drone 1 (55Hz low sine)
        const osc1 = audioCtx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(55, audioCtx.currentTime);
        const osc1Gain = audioCtx.createGain();
        osc1Gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc1.connect(osc1Gain);
        osc1Gain.connect(ambientGain);
        osc1.start();

        // Hollow howling wind (White noise + bandpass)
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(140, audioCtx.currentTime);
        filter.Q.setValueAtTime(2.2, audioCtx.currentTime);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.065, audioCtx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ambientGain);
        whiteNoise.start();
      }

      const sfx = {
        step() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(65 + Math.random() * 20, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
          } catch(e){}
        },
        jump() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(240, now + 0.12);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
          } catch(e){}
        },
        land() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(90, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.16);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
          } catch(e){}
        },
        grab() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
          } catch(e){}
        },
        dragCrate() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(45 + Math.random() * 15, now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
          } catch(e){}
        },
        trapSnap() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc2.type = 'square';
            osc1.frequency.setValueAtTime(860, now);
            osc1.frequency.exponentialRampToValueAtTime(60, now + 0.28);
            osc2.frequency.setValueAtTime(420, now);
            osc2.frequency.exponentialRampToValueAtTime(40, now + 0.3);
            gain.gain.setValueAtTime(0.48, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            osc1.start(now); osc2.start(now);
            osc1.stop(now + 0.3); osc2.stop(now + 0.3);
          } catch(e){}
        },
        spiderStomp() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(80, now);
            osc.frequency.exponentialRampToValueAtTime(24, now + 0.35);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
          } catch(e){}
        },
        spiderScreech() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.linearRampToValueAtTime(880, now + 0.2);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.6);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
          } catch(e){}
        },
        boulderRumble() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(38 + Math.random() * 8, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
          } catch(e){}
        },
        boulderCrash() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(18, now + 0.7);
            gain.gain.setValueAtTime(0.65, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.7);
          } catch(e){}
        },
        crowCaw() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.linearRampToValueAtTime(320, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
          } catch(e){}
        },
        death() {
          if (!soundEnabled || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(18, now + 0.6);
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
          } catch(e){}
        }
      };

      audioToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        audioToggle.textContent = soundEnabled ? '🔊' : '🔇';
        if (ambientGain) ambientGain.gain.setValueAtTime(soundEnabled ? 0.24 : 0, audioCtx.currentTime);
      });

      /* ==========================================================================
         INPUT CONTROLLER (DUAL KEYBOARD & FLOATING TOUCH JOYSTICK)
         ========================================================================== */
      const input = {
        left: false,
        right: false,
        up: false,
        down: false,
        jump: false,
        grab: false,
        analogX: 0
      };

      // Keyboard
      window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.repeat) return;
        if (['ArrowLeft', 'KeyA'].includes(e.code)) input.left = true;
        if (['ArrowRight', 'KeyD'].includes(e.code)) input.right = true;
        if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) { input.up = true; input.jump = true; }
        if (['ArrowDown', 'KeyS'].includes(e.code)) input.down = true;
        if (['ShiftLeft', 'ShiftRight', 'KeyE', 'ControlLeft', 'KeyF'].includes(e.code)) input.grab = true;
      });

      window.addEventListener('keyup', (e) => {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) input.left = false;
        if (['ArrowRight', 'KeyD'].includes(e.code)) input.right = false;
        if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) { input.up = false; input.jump = false; }
        if (['ArrowDown', 'KeyS'].includes(e.code)) input.down = false;
        if (['ShiftLeft', 'ShiftRight', 'KeyE', 'ControlLeft', 'KeyF'].includes(e.code)) input.grab = false;
      });

      // Mobile Touch Floating Joystick
      let stickPointerId = null;
      let stickStartX = 0;
      let stickStartY = 0;

      stickArea.addEventListener('pointerdown', (e) => {
        initAudio();
        if (stickPointerId !== null) return;
        stickPointerId = e.pointerId;
        try { stickArea.setPointerCapture(e.pointerId); } catch(err){}

        stickStartX = e.clientX;
        stickStartY = e.clientY;
        virtualStick.style.display = 'block';
        virtualStick.style.left = `${stickStartX}px`;
        virtualStick.style.top = `${stickStartY}px`;
        updateStick(e.clientX, e.clientY);
      });

      stickArea.addEventListener('pointermove', (e) => {
        if (e.pointerId === stickPointerId) {
          updateStick(e.clientX, e.clientY);
        }
      });

      const endStick = (e) => {
        if (e.pointerId === stickPointerId) {
          stickPointerId = null;
          input.analogX = 0;
          input.left = false;
          input.right = false;
          input.up = false;
          input.down = false;
          virtualStick.style.display = 'none';
          virtualKnob.style.transform = 'translate(-50%, -50%)';
        }
      };
      stickArea.addEventListener('pointerup', endStick);
      stickArea.addEventListener('pointercancel', endStick);

      function updateStick(cx, cy) {
        const maxR = 50;
        let dx = cx - stickStartX;
        let dy = cy - stickStartY;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        virtualKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

        const normX = dx / maxR;
        const normY = dy / maxR;
        input.analogX = normX;
        input.left = normX < -0.22;
        input.right = normX > 0.22;
        input.up = normY < -0.45;
        input.down = normY > 0.45;
      }

      // Mobile Action Buttons
      jumpBtn.addEventListener('pointerdown', (e) => {
        initAudio();
        e.preventDefault();
        input.jump = true;
        input.up = true;
        jumpBtn.classList.add('active');
      });
      jumpBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        input.jump = false;
        input.up = false;
        jumpBtn.classList.remove('active');
      });
      jumpBtn.addEventListener('pointercancel', (e) => {
        input.jump = false;
        input.up = false;
        jumpBtn.classList.remove('active');
      });

      grabBtn.addEventListener('pointerdown', (e) => {
        initAudio();
        e.preventDefault();
        input.grab = true;
        grabBtn.classList.add('active');
      });
      grabBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        input.grab = false;
        grabBtn.classList.remove('active');
      });
      grabBtn.addEventListener('pointercancel', (e) => {
        input.grab = false;
        grabBtn.classList.remove('active');
      });

      /* ==========================================================================
         CAMERA SHAKE & CINEMATICS
         ========================================================================== */
      let camX = 0;
      let camY = 0;
      let shakeTrauma = 0;

      function addTrauma(amount) {
        shakeTrauma = Math.min(1.0, shakeTrauma + amount);
      }

      /* ==========================================================================
         WORLD PROPS & PUZZLE ENTITIES
         ========================================================================== */
      class BoxProp {
        constructor(x, y, w, h, mass = 1.0) {
          this.initialX = x;
          this.initialY = y;
          this.x = x;
          this.y = y;
          this.w = w;
          this.h = h;
          this.vx = 0;
          this.vy = 0;
          this.mass = mass;
          this.isGrounded = false;
        }

        reset() {
          this.x = this.initialX;
          this.y = this.initialY;
          this.vx = 0;
          this.vy = 0;
        }

        update(dt, solids) {
          this.vy += 1750 * dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.vx *= Math.pow(0.001, dt);

          this.isGrounded = false;
          for (const s of solids) {
            if (this.x + this.w > s.x && this.x < s.x + s.w) {
              // Floor
              if (this.y + this.h >= s.y && this.y + this.h - this.vy * dt <= s.y + 14) {
                this.y = s.y - this.h;
                this.vy = 0;
                this.isGrounded = true;
              }
              // Ceiling
              else if (this.y <= s.y + s.h && this.y - this.vy * dt >= s.y + s.h - 14) {
                this.y = s.y + s.h;
                this.vy = 0;
              }
            }
          }
        }

        draw(ctx, camX) {
          const rx = this.x - camX;
          const ry = this.y;

          ctx.fillStyle = '#000000';
          ctx.fillRect(rx, ry, this.w, this.h);

          // Subtle wood plank detailing
          ctx.strokeStyle = '#181a1d';
          ctx.lineWidth = 2;
          ctx.strokeRect(rx + 2, ry + 2, this.w - 4, this.h - 4);
          ctx.beginPath();
          ctx.moveTo(rx + 3, ry + 3); ctx.lineTo(rx + this.w - 3, ry + this.h - 3);
          ctx.moveTo(rx + this.w - 3, ry + 3); ctx.lineTo(rx + 3, ry + this.h - 3);
          ctx.stroke();

          // Small iron wheels on the cart
          ctx.fillStyle = '#0a0a0c';
          ctx.beginPath();
          ctx.arc(rx + 10, ry + this.h, 6, 0, Math.PI * 2);
          ctx.arc(rx + this.w - 10, ry + this.h, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      class RopeProp {
        constructor(anchorX, anchorY, length = 260) {
          this.anchorX = anchorX;
          this.anchorY = anchorY;
          this.length = length;
          this.angle = 0;
          this.angularVelocity = 0;
        }

        update(dt) {
          const gravity = 9.81 * 85;
          const angularAcc = (-gravity / this.length) * Math.sin(this.angle);
          this.angularVelocity += angularAcc * dt;
          this.angularVelocity *= Math.pow(0.985, dt * 60);
          this.angle += this.angularVelocity * dt;
        }

        getTip() {
          return {
            x: this.anchorX + Math.sin(this.angle) * this.length,
            y: this.anchorY + Math.cos(this.angle) * this.length
          };
        }

        draw(ctx, camX) {
          const tip = this.getTip();
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(this.anchorX - camX, this.anchorY);
          ctx.lineTo(tip.x - camX, tip.y);
          ctx.stroke();

          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(tip.x - camX, tip.y, 6.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      class BearTrapProp {
        constructor(x, y) {
          this.initialX = x;
          this.initialY = y;
          this.x = x;
          this.y = y;
          this.w = 58;
          this.h = 24;
          this.vx = 0;
          this.vy = 0;
          this.sprung = false;
        }

        reset() {
          this.x = this.initialX;
          this.y = this.initialY;
          this.vx = 0;
          this.vy = 0;
          this.sprung = false;
        }

        trigger() {
          if (!this.sprung) {
            this.sprung = true;
            sfx.trapSnap();
            addTrauma(0.4);
          }
        }

        update(dt, solids) {
          this.vy += 1750 * dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.vx *= Math.pow(0.001, dt);

          for (const s of solids) {
            if (this.x + this.w > s.x && this.x < s.x + s.w) {
              if (this.y + this.h >= s.y && this.y + this.h - this.vy * dt <= s.y + 14) {
                this.y = s.y - this.h;
                this.vy = 0;
              }
            }
          }
        }

        draw(ctx, camX) {
          const rx = this.x - camX;
          const ry = this.y;

          ctx.fillStyle = '#000000';
          if (!this.sprung) {
            // Open heavy jagged steel teeth
            ctx.fillRect(rx, ry + 16, this.w, 8);
            ctx.beginPath();
            for (let i = 0; i < 7; i++) {
              ctx.lineTo(rx + i * 8.2, ry + 16);
              ctx.lineTo(rx + i * 8.2 + 4.1, ry + 4);
            }
            ctx.lineTo(rx + this.w, ry + 16);
            ctx.fill();
          } else {
            // Snapped shut upright bloody jaws
            ctx.fillRect(rx + 18, ry - 8, 22, 32);
            ctx.beginPath();
            ctx.moveTo(rx + 12, ry + 22);
            ctx.lineTo(rx + 29, ry - 16);
            ctx.lineTo(rx + 46, ry + 22);
            ctx.fill();
          }
        }
      }

      class RollingBoulder {
        constructor(x, y, radius = 48) {
          this.initialX = x;
          this.initialY = y;
          this.x = x;
          this.y = y;
          this.r = radius;
          this.vx = 0;
          this.vy = 0;
          this.angle = 0;
          this.active = false;
          this.destroyed = false;
          this.soundTimer = 0;
        }

        reset() {
          this.x = this.initialX;
          this.y = this.initialY;
          this.vx = 0;
          this.vy = 0;
          this.angle = 0;
          this.active = false;
          this.destroyed = false;
        }

        trigger() {
          if (!this.active && !this.destroyed) {
            this.active = true;
            this.vx = 140;
            addTrauma(0.5);
            sfx.boulderCrash();
          }
        }

        update(dt, solids, player) {
          if (!this.active || this.destroyed) return;

          // Rolling physics down the hill
          this.vy += 1600 * dt;
          this.vx += 160 * dt; // Accelerating boulder!
          this.vx = Math.min(380, this.vx);
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          this.angle += (this.vx / this.r) * dt;

          this.soundTimer += dt;
          if (this.soundTimer > 0.08) {
            this.soundTimer = 0;
            sfx.boulderRumble();
            addTrauma(0.04);
          }

          // Collisions with terrain
          for (const s of solids) {
            if (this.x + this.r > s.x && this.x - this.r < s.x + s.w) {
              if (this.y + this.r >= s.y && this.y + this.r - this.vy * dt <= s.y + 20) {
                this.y = s.y - this.r;
                this.vy = 0;
              }
            }
          }

          // Boulder crashes into the ravine wall at x = 1840
          if (this.x > 1820) {
            this.destroyed = true;
            this.active = false;
            addTrauma(0.75);
            sfx.boulderCrash();
          }

          // Crushes the player
          if (player.state !== 'DEAD') {
            const dist = Math.hypot((player.x + player.w / 2) - this.x, (player.y + player.h / 2) - this.y);
            if (dist < this.r + 14) {
              killPlayer('Vom herabrollenden Felsen zermalmt …');
            }
          }
        }

        draw(ctx, camX) {
          if (this.destroyed) return;
          const rx = this.x - camX;
          const ry = this.y;

          ctx.save();
          ctx.translate(rx, ry);
          ctx.rotate(this.angle);

          // Jagged mossy silhouette boulder
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          const points = 14;
          for (let i = 0; i < points; i++) {
            const a = (i / points) * Math.PI * 2;
            const rad = this.r * (0.88 + Math.sin(i * 3.4) * 0.12);
            const px = Math.cos(a) * rad;
            const py = Math.sin(a) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();

          // Internal rock cracks
          ctx.strokeStyle = '#121417';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-16, -10); ctx.lineTo(6, 12); ctx.lineTo(24, -8);
          ctx.stroke();

          ctx.restore();
        }
      }

      class RavenCluster {
        constructor(x, y, count = 4) {
          this.x = x;
          this.y = y;
          this.crows = [];
          for (let i = 0; i < count; i++) {
            this.crows.push({
              relX: (i - count / 2) * 16,
              relY: Math.random() * 8,
              flying: false,
              vx: 0,
              vy: 0,
              wingPhase: Math.random() * Math.PI * 2
            });
          }
          this.triggered = false;
        }

        reset() {
          this.triggered = false;
          for (const c of this.crows) {
            c.flying = false;
            c.vx = 0;
            c.vy = 0;
          }
        }

        update(dt, playerX) {
          if (!this.triggered && playerX > this.x - 220) {
            this.triggered = true;
            sfx.crowCaw();
            for (const c of this.crows) {
              c.flying = true;
              c.vx = 80 + Math.random() * 140;
              c.vy = -120 - Math.random() * 160;
            }
          }

          for (const c of this.crows) {
            if (c.flying) {
              c.relX += c.vx * dt;
              c.relY += c.vy * dt;
              c.wingPhase += dt * 24;
            }
          }
        }

        draw(ctx, camX) {
          ctx.fillStyle = '#000000';
          for (const c of this.crows) {
            const rx = this.x + c.relX - camX;
            const ry = this.y + c.relY;

            if (!c.flying) {
              // Perched crow silhouette
              ctx.beginPath();
              ctx.ellipse(rx, ry, 5, 3.5, 0.2, 0, Math.PI * 2);
              ctx.arc(rx + 4, ry - 3, 2.5, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // Flapping in flight
              const wingY = Math.sin(c.wingPhase) * 6;
              ctx.beginPath();
              ctx.moveTo(rx, ry);
              ctx.lineTo(rx - 7, ry - wingY);
              ctx.lineTo(rx, ry - 2);
              ctx.lineTo(rx + 7, ry - wingY);
              ctx.fill();
            }
          }
        }
      }

      class GiantSpiderBoss {
        constructor(x, y) {
          this.initialX = x;
          this.initialY = y;
          this.x = x;
          this.y = y;
          this.legPhases = [0, 1.2, 2.5, 3.8];
          this.defeated = false;
          this.retreatX = 0;
          this.strikeLeg = { x: x - 120, y: y + 360, vy: 0, state: 'IDLE', timer: 0 };
        }

        reset() {
          this.x = this.initialX;
          this.y = this.initialY;
          this.defeated = false;
          this.retreatX = 0;
          this.strikeLeg.state = 'IDLE';
          this.strikeLeg.timer = 0;
        }

        update(dt, player, bearTrap) {
          if (this.defeated) {
            // Spider flees upwards and disappears into canopy
            this.x += 180 * dt;
            this.y -= 140 * dt;
            for (let i = 0; i < this.legPhases.length; i++) {
              this.legPhases[i] += dt * 8;
            }
            return;
          }

          // Leg phase walking cycle
          for (let i = 0; i < this.legPhases.length; i++) {
            this.legPhases[i] += dt * 3.5;
          }

          // Spider strike behavior
          const distToPlayer = player.x - (this.x - 120);

          // Check if bear trap is in strike zone
          const trapInZone = bearTrap.x > this.x - 180 && bearTrap.x < this.x - 60 && !bearTrap.sprung;

          if (this.strikeLeg.state === 'IDLE') {
            if (player.x > this.x - 340 && player.x < this.x + 200) {
              this.strikeLeg.state = 'WINDUP';
              this.strikeLeg.timer = 0;
            }
          } else if (this.strikeLeg.state === 'WINDUP') {
            this.strikeLeg.timer += dt;
            // Leg raises high menacingly
            this.strikeLeg.y = (this.y + 360) - Math.min(180, this.strikeLeg.timer * 340);

            if (this.strikeLeg.timer > 0.65) {
              this.strikeLeg.state = 'STRIKE';
              this.strikeLeg.timer = 0;
            }
          } else if (this.strikeLeg.state === 'STRIKE') {
            // Searing downward strike!
            this.strikeLeg.y += 950 * dt;

            // Hits ground / floor
            if (this.strikeLeg.y >= 430) {
              this.strikeLeg.y = 430;
              sfx.spiderStomp();
              addTrauma(0.4);

              // Check if struck the bear trap!
              if (trapInZone) {
                bearTrap.trigger();
                this.defeated = true;
                sfx.spiderScreech();
                addTrauma(0.8);
                promptBanner.textContent = 'Die Falle schnappt zu! Die Spinne flieht!';
                return;
              }

              // Check if struck the player
              if (player.state !== 'DEAD' && Math.abs(player.x - (this.x - 120)) < 45) {
                killPlayer('Vom Spinnenstachel durchbohrt …');
              }

              this.strikeLeg.state = 'RECOVER';
              this.strikeLeg.timer = 0;
            }
          } else if (this.strikeLeg.state === 'RECOVER') {
            this.strikeLeg.timer += dt;
            if (this.strikeLeg.timer > 0.6) {
              this.strikeLeg.state = 'IDLE';
            }
          }
        }

        draw(ctx, camX) {
          const rx = this.x - camX;
          const ry = this.y;

          ctx.save();
          // Large cephalothorax silhouette
          ctx.fillStyle = '#020202';
          ctx.beginPath();
          ctx.ellipse(rx, ry, 85, 60, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.ellipse(rx - 65, ry + 22, 48, 38, -0.2, 0, Math.PI * 2);
          ctx.fill();

          // Menacing Glowing Eyes
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(rx - 90, ry + 16, 5, 0, Math.PI * 2);
          ctx.arc(rx - 76, ry + 26, 4, 0, Math.PI * 2);
          ctx.arc(rx - 82, ry + 10, 3.5, 0, Math.PI * 2);
          ctx.arc(rx - 95, ry + 28, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Chitin stilt legs
          ctx.strokeStyle = '#020202';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // 3 Back Legs
          for (let i = 1; i < 4; i++) {
            const phase = this.legPhases[i];
            const legLift = Math.max(0, Math.sin(phase)) * 55;
            const footX = rx - 80 + i * 110 + Math.cos(phase) * 35;
            const footY = ry + 440 - legLift;
            const kneeX = (rx + footX) / 2 + (i < 2 ? -70 : 80);
            const kneeY = ry - 50;

            ctx.lineWidth = 14 - i * 1.5;
            ctx.beginPath();
            ctx.moveTo(rx - 20 + i * 18, ry);
            ctx.lineTo(kneeX, kneeY);
            ctx.lineTo(footX, footY);
            ctx.stroke();
          }

          // 1 Front Combat Strike Leg
          const strikeX = rx - 120;
          const strikeY = this.defeated ? ry + 200 : this.strikeLeg.y;
          const kneeX = (rx + strikeX) / 2 - 90;
          const kneeY = ry - 80;

          ctx.lineWidth = 15;
          ctx.beginPath();
          ctx.moveTo(rx - 45, ry + 10);
          ctx.lineTo(kneeX, kneeY);
          ctx.lineTo(strikeX, strikeY);
          ctx.stroke();

          // Barbed needle tip
          ctx.beginPath();
          ctx.moveTo(strikeX - 6, strikeY - 20);
          ctx.lineTo(strikeX, strikeY + 12);
          ctx.lineTo(strikeX + 6, strikeY - 20);
          ctx.fill();

          ctx.restore();
        }
      }

      /* ==========================================================================
         THE BOY (PROTAGONIST STATE MACHINE WITH LEDGE HANG & MANTLE)
         ========================================================================== */
      const player = {
        x: 80,
        y: 440,
        w: 24,
        h: 56,
        vx: 0,
        vy: 0,
        facing: 1, // 1 = right, -1 = left
        state: 'WAKEUP', // WAKEUP, IDLE, RUN, JUMP, FALL, HANG, MANTLE, PUSH, ROPE, DEAD
        stateTimer: 0,
        animFrame: 0,
        isGrounded: false,
        hangEdge: null,
        rope: null,
        eyeBlinkTimer: 3.2,
        checkpointX: 80,
        checkpointY: 440,
        deaths: 0,
        jumpPrev: false
      };

      /* ==========================================================================
         WORLD GEOMETRY (PRECISE, BALANCED & REWARDING LEVEL DESIGN)
         ========================================================================== */
      const solids = [
        // Zone 1: Forest Floor (start, awakened boy, crows)
        { x: -300, y: 560, w: 920, h: 400 },

        // Zone 2: The Cliff (y: 445 -> 115px height, easy mantle & cart boost)
        { x: 620, y: 445, w: 600, h: 520 },

        // Zone 3: Incline & Boulder Slope
        { x: 1220, y: 420, w: 460, h: 540 },
        // Ravine Trench for boulder to smash (spikes at bottom)
        { x: 1820, y: 420, w: 140, h: 540 },

        // Zone 4: Chasm & Water Pit with Floating Log
        { x: 2060, y: 550, w: 90, h: 30 }, // Floating mossy log stepping stone!
        { x: 2340, y: 420, w: 760, h: 540 }, // Far side of the chasm

        // Zone 5: Spider Clearing
        { x: 3100, y: 420, w: 700, h: 540 },

        // Zone 6: Fallen Tree Bridge & Beyond to Chapter 2
        { x: 3800, y: 420, w: 1200, h: 540 }
      ];

      const cart = new BoxProp(460, 500, 58, 56, 1.2);
      const bearTrap = new BearTrapProp(2700, 396);
      const boulder = new RollingBoulder(1180, 340, 48);
      const rope = new RopeProp(2210, 140, 270);
      const spider = new GiantSpiderBoss(3340, 140);
      const crowCluster = new RavenCluster(340, 480, 5);

      // Ambient Drifting Mist Spores
      const spores = [];
      for (let i = 0; i < 48; i++) {
        spores.push({
          x: Math.random() * 4500,
          y: Math.random() * 660,
          r: 1.2 + Math.random() * 2.2,
          vx: 8 + Math.random() * 16,
          phase: Math.random() * Math.PI * 2
        });
      }

      /* ==========================================================================
         PHYSICS & PLAYER CONTROLLER
         ========================================================================== */
      let lastTime = performance.now();
      let stepTimer = 0;

      function update(dt) {
        // Screen shake decay
        shakeTrauma = Math.max(0, shakeTrauma - 1.2 * dt);

        if (player.state === 'DEAD') {
          player.stateTimer += dt;
          if (player.stateTimer > 1.8) {
            respawnPlayer();
          }
          return;
        }

        // 1. Wakeup Intro
        if (player.state === 'WAKEUP') {
          player.stateTimer += dt;
          if (player.stateTimer > 2.4 || input.left || input.right || input.jump) {
            player.state = 'IDLE';
            promptBanner.textContent = 'Renne vorwärts [A/D] · Springe [W/Leertaste]';
          }
          return;
        }

        // 2. Rope Interaction
        if (player.state === 'ROPE') {
          rope.update(dt);
          const tip = rope.getTip();
          player.x = tip.x - player.w / 2;
          player.y = tip.y - player.h * 0.8;
          player.vx = 0;
          player.vy = 0;

          // Build swing momentum
          if (input.left) rope.angularVelocity -= 2.2 * dt;
          if (input.right) rope.angularVelocity += 2.2 * dt;

          // Leap off rope
          if (input.jump && !player.jumpPrev) {
            player.state = 'JUMP';
            player.rope = null;
            player.vy = -560;
            // Strong forward momentum boost on launch
            const swingDir = rope.angularVelocity > 0 ? 1 : -1;
            player.vx = swingDir * (280 + Math.abs(rope.angularVelocity * rope.length * 1.6));
            sfx.jump();
          }
          player.jumpPrev = input.jump;
          return;
        }

        // Check if catching rope
        if (input.grab || input.jump) {
          const tip = rope.getTip();
          const distToRope = Math.hypot((player.x + player.w / 2) - tip.x, (player.y + player.h / 2) - tip.y);
          if (distToRope < 55 && player.y > rope.anchorY + 70) {
            player.state = 'ROPE';
            player.rope = rope;
            sfx.grab();
            return;
          }
        }

        // 3. Ledge Hang & Mantle System
        if (player.state === 'HANG') {
          player.vx = 0;
          player.vy = 0;
          // Pressing UP or JUMP initiates climb up
          if (input.up || input.jump) {
            player.state = 'MANTLE';
            player.stateTimer = 0;
            sfx.grab();
          }
          // Pressing DOWN releases ledge
          else if (input.down) {
            player.state = 'FALL';
            player.y += 18;
            player.vy = 120;
          }
          player.jumpPrev = input.jump;
          return;
        }

        if (player.state === 'MANTLE') {
          player.stateTimer += dt;
          const prog = Math.min(1, player.stateTimer / 0.28);
          // Pull up onto ledge top
          if (prog >= 1.0) {
            player.y = player.hangEdge.y - player.h;
            player.x += player.hangEdge.dir * 22;
            player.vx = 0;
            player.vy = 0;
            player.isGrounded = true;
            player.state = 'IDLE';
            sfx.land();
          }
          player.jumpPrev = input.jump;
          return;
        }

        // 4. Horizontal Movement
        const moveAxis = input.analogX !== 0 ? input.analogX : (input.right ? 1 : 0) - (input.left ? 1 : 0);
        const targetSpeed = moveAxis * 290;
        const accel = player.isGrounded ? 18 : 7;
        player.vx += (targetSpeed - player.vx) * Math.min(1, accel * dt);

        if (Math.abs(moveAxis) > 0.08) {
          player.facing = moveAxis > 0 ? 1 : -1;
        }

        // Gravity & Position
        player.vy += 1750 * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Footsteps
        if (player.isGrounded && Math.abs(player.vx) > 30) {
          stepTimer += dt * (Math.abs(player.vx) / 130);
          if (stepTimer >= 1.0) {
            stepTimer = 0;
            sfx.step();
          }
        }

        // 5. Solid Floor & Wall Collisions
        player.isGrounded = false;
        for (const s of solids) {
          if (player.x + player.w > s.x && player.x < s.x + s.w) {
            // Floor landing
            if (player.y + player.h >= s.y && player.y + player.h - player.vy * dt <= s.y + 18) {
              player.y = s.y - player.h;
              if (player.vy > 380) {
                sfx.land();
                addTrauma(0.08);
              }
              player.vy = 0;
              player.isGrounded = true;
            }
          }

          // Wall collisions
          if (player.y + player.h > s.y + 14 && player.y < s.y + s.h) {
            if (player.vx > 0 && player.x + player.w >= s.x && player.x < s.x) {
              player.x = s.x - player.w;
              player.vx = 0;
            } else if (player.vx < 0 && player.x <= s.x + s.w && player.x + player.w > s.x + s.w) {
              player.x = s.x + s.w;
              player.vx = 0;
            }
          }

          // 6. Ledge Grab Detection (Airborne near top edge)
          if (!player.isGrounded && player.vy > -100 && !input.down) {
            // Left corner of solid (grabbing when moving right)
            if (player.facing === 1 && Math.abs((player.x + player.w) - s.x) < 14) {
              if (player.y + 24 >= s.y && player.y <= s.y + 4) {
                player.state = 'HANG';
                player.hangEdge = { x: s.x, y: s.y, dir: 1 };
                player.x = s.x - player.w + 2;
                player.y = s.y - 14;
                player.vx = 0;
                player.vy = 0;
                sfx.grab();
                return;
              }
            }
            // Right corner of solid (grabbing when moving left)
            else if (player.facing === -1 && Math.abs(player.x - (s.x + s.w)) < 14) {
              if (player.y + 24 >= s.y && player.y <= s.y + 4) {
                player.state = 'HANG';
                player.hangEdge = { x: s.x + s.w, y: s.y, dir: -1 };
                player.x = s.x + s.w - 2;
                player.y = s.y - 14;
                player.vx = 0;
                player.vy = 0;
                sfx.grab();
                return;
              }
            }
          }
        }

        // 7. Interactive Pushable Props (Cart & Bear Trap)
        let isPushing = false;

        // Wooden Cart
        cart.update(dt, solids);
        if (Math.abs((player.x + player.w / 2) - (cart.x + cart.w / 2)) < (player.w / 2 + cart.w / 2 + 14)) {
          if (Math.abs((player.y + player.h / 2) - (cart.y + cart.h / 2)) < 32) {
            isPushing = true;
            if (input.grab) {
              cart.vx = player.vx * 0.75;
              player.vx *= 0.75;
              sfx.dragCrate();
            } else {
              if (player.vx > 0 && player.x + player.w >= cart.x && player.x < cart.x) {
                player.x = cart.x - player.w;
                cart.vx = Math.max(cart.vx, player.vx * 0.85);
                sfx.dragCrate();
              } else if (player.vx < 0 && player.x <= cart.x + cart.w && player.x > cart.x) {
                player.x = cart.x + cart.w;
                cart.vx = Math.min(cart.vx, player.vx * 0.85);
                sfx.dragCrate();
              }
            }
          }
        }

        // Standing on Cart
        if (player.x + player.w > cart.x && player.x < cart.x + cart.w) {
          if (player.y + player.h >= cart.y && player.y + player.h - player.vy * dt <= cart.y + 16) {
            player.y = cart.y - player.h;
            player.vy = 0;
            player.isGrounded = true;
          }
        }

        // Bear Trap Drag & Push
        bearTrap.update(dt, solids);
        if (!bearTrap.sprung) {
          if (Math.abs((player.x + player.w / 2) - (bearTrap.x + bearTrap.w / 2)) < (player.w / 2 + bearTrap.w / 2 + 12)) {
            if (Math.abs((player.y + player.h) - (bearTrap.y + bearTrap.h)) < 18) {
              if (input.grab) {
                isPushing = true;
                bearTrap.vx = player.vx * 0.7;
                player.vx *= 0.7;
                sfx.dragCrate();
              } else {
                // Stepped into open bear trap!
                bearTrap.trigger();
                killPlayer('In die Bärenfalle getreten …');
              }
            }
          }
        }

        // 8. Rolling Boulder Trap
        if (!boulder.active && player.x > 1350) {
          boulder.trigger();
          promptBanner.textContent = 'ACHTUNG! EIN FELS! LAUF!';
        }
        boulder.update(dt, solids, player);

        // 9. Crows Flying
        crowCluster.update(dt, player.x);

        // 10. Water Drowning
        if (player.y > 640) {
          killPlayer('In den dunklen Abgrund gestürzt …');
        }

        // 11. Spider Update
        spider.update(dt, player, bearTrap);

        // 12. Jumping
        if (input.jump && player.isGrounded && !player.jumpPrev) {
          player.vy = -560;
          player.isGrounded = false;
          sfx.jump();
        }
        player.jumpPrev = input.jump;

        // 13. State & Animation
        if (isPushing) {
          player.state = 'PUSH';
        } else if (!player.isGrounded) {
          player.state = player.vy < 0 ? 'JUMP' : 'FALL';
        } else if (Math.abs(player.vx) > 35) {
          player.state = 'RUN';
        } else {
          player.state = 'IDLE';
        }

        player.animFrame += dt * (player.state === 'RUN' ? 14 : 4);

        // Eye Blink
        player.eyeBlinkTimer -= dt;
        if (player.eyeBlinkTimer <= 0) {
          player.eyeBlinkTimer = 2.4 + Math.random() * 3.2;
        }

        // Camera Tracking
        const targetCamX = player.x - VW * 0.35;
        camX += (targetCamX - camX) * Math.min(1, 4.5 * dt);

        // Checkpoints
        if (player.x > 640 && player.checkpointX < 640) {
          player.checkpointX = 660;
          player.checkpointY = 380;
          promptBanner.textContent = 'Klippe erklommen · Kontrollpunkt erreicht';
        }
        if (player.x > 1850 && player.checkpointX < 1850) {
          player.checkpointX = 1860;
          player.checkpointY = 360;
          promptBanner.textContent = 'Schlucht erreicht · Schwinge am Seil!';
        }
        if (player.x > 2600 && player.checkpointX < 2600) {
          player.checkpointX = 2620;
          player.checkpointY = 360;
          chapterTag.textContent = 'KAPITEL II · DER SCHATTEN DER SPINNE';
          promptBanner.textContent = 'Ziehe die Bärenfalle unter das Spinnenbein!';
        }
        if (player.x > 4000) {
          promptBanner.textContent = 'KAPITEL I GESCHAFFT! In die tiefen Schatten …';
        }
      }

      function killPlayer(reason) {
        if (player.state === 'DEAD') return;
        player.state = 'DEAD';
        player.stateTimer = 0;
        player.deaths++;
        sfx.death();
        addTrauma(0.6);
        promptBanner.textContent = reason;
      }

      function respawnPlayer() {
        player.x = player.checkpointX;
        player.y = player.checkpointY;
        player.vx = 0;
        player.vy = 0;
        player.state = 'IDLE';
        player.stateTimer = 0;
        boulder.reset();
        // Reset props if checkpoint was before them
        if (player.checkpointX < 600) cart.reset();
        if (player.checkpointX < 2600) {
          bearTrap.reset();
          spider.reset();
        }
      }

      /* ==========================================================================
         CINEMATIC RENDER PIPELINE (PARALLAX, VOLUMETRIC GOD RAYS, SILHOUETTES)
         ========================================================================== */
      function render() {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Screen shake trauma application
        const shakeMag = shakeTrauma * shakeTrauma * 24;
        const shakeX = (Math.random() * 2 - 1) * shakeMag;
        const shakeY = (Math.random() * 2 - 1) * shakeMag;

        ctx.translate(shakeX, shakeY);
        ctx.scale(scale, scale);

        // 1. SKY GRADIENT (DARK AMBIENT GREY TO INKY VOID)
        const skyGrad = ctx.createRadialGradient(VW * 0.45, VH * 0.25, 60, VW * 0.5, VH * 0.5, VW * 0.85);
        skyGrad.addColorStop(0, '#4e535c');
        skyGrad.addColorStop(0.4, '#27292f');
        skyGrad.addColorStop(0.8, '#101115');
        skyGrad.addColorStop(1, '#050508');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(-200, 0, VW + 400, VH);

        // 2. LAYER 1: DISTANT MISTY MOUNTAIN RIDGES (0.07x Parallax)
        const l1X = camX * 0.07;
        ctx.fillStyle = '#17191d';
        ctx.beginPath();
        ctx.moveTo(-200, VH);
        for (let x = -200; x < VW + 400; x += 180) {
          const mx = x - (l1X % 180);
          ctx.lineTo(mx, 320 + Math.sin(x * 0.005) * 45);
          ctx.lineTo(mx + 90, 240 + Math.cos(x * 0.004) * 35);
        }
        ctx.lineTo(VW + 400, VH);
        ctx.fill();

        // 3. VOLUMETRIC GOD RAYS (CINEMATIC LIGHT BEAMS)
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const rayGrad = ctx.createLinearGradient(0, 0, 450, VH);
        rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.17)');
        rayGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.04)');
        rayGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = rayGrad;

        const rayShift = Math.sin(performance.now() * 0.0007) * 25;
        ctx.beginPath();
        ctx.moveTo(200 + rayShift, 0); ctx.lineTo(380 + rayShift, 0);
        ctx.lineTo(580 + rayShift, VH); ctx.lineTo(360 + rayShift, VH);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(700 + rayShift * 0.6, 0); ctx.lineTo(840 + rayShift * 0.6, 0);
        ctx.lineTo(1120 + rayShift * 0.6, VH); ctx.lineTo(940 + rayShift * 0.6, VH);
        ctx.fill();
        ctx.restore();

        // 4. LAYER 2: MIDGROUND DEAD GNARLED TREES (0.28x Parallax)
        const l2X = camX * 0.28;
        ctx.fillStyle = '#0f1013';
        for (let x = -400; x < VW + 400; x += 320) {
          const tx = x - (l2X % 320);
          ctx.beginPath();
          ctx.moveTo(tx, VH);
          ctx.quadraticCurveTo(tx + 25, 380, tx + 15, 120);
          ctx.lineTo(tx + 45, 120);
          ctx.quadraticCurveTo(tx + 55, 380, tx + 75, VH);
          ctx.fill();

          ctx.lineWidth = 6;
          ctx.strokeStyle = '#0f1013';
          ctx.beginPath();
          ctx.moveTo(tx + 22, 280); ctx.quadraticCurveTo(tx - 60, 220, tx - 95, 240);
          ctx.moveTo(tx + 40, 210); ctx.quadraticCurveTo(tx + 110, 160, tx + 140, 180);
          ctx.stroke();
        }

        // 5. DRIFTING MIST SHEETS
        ctx.fillStyle = 'rgba(40, 44, 50, 0.22)';
        for (let i = 0; i < 5; i++) {
          const mx = ((i * 400 - camX * 0.4 + performance.now() * 0.015) % 2200) - 300;
          ctx.beginPath();
          ctx.ellipse(mx, 430 + Math.sin(i * 1.5) * 22, 280, 70, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Crows
        crowCluster.draw(ctx, camX);

        // 6. GIANT SPIDER BOSS
        spider.draw(ctx, camX);

        // 7. LAYER 3: FOREGROUND GAMEPLAY SILHOUETTES
        ctx.fillStyle = '#000000';
        for (const s of solids) {
          ctx.fillRect(s.x - camX, s.y, s.w, s.h);
        }

        // Detailed grass blades on tops of solids
        ctx.fillStyle = '#000000';
        for (let x = -200; x < 4400; x += 20) {
          const gx = x - camX;
          if (gx > -40 && gx < VW + 40) {
            const solid = solids.find(s => x >= s.x && x <= s.x + s.w);
            if (solid && solid.y < 600) {
              const h = 7 + (Math.sin(x) * 5);
              ctx.beginPath();
              ctx.moveTo(gx, solid.y);
              ctx.quadraticCurveTo(gx + 3, solid.y - h, gx + 6, solid.y);
              ctx.fill();
            }
          }
        }

        // Fallen Tree Trunk Ramp (appears after spider is defeated)
        if (spider.defeated) {
          const logX = 3520 - camX;
          ctx.save();
          ctx.fillStyle = '#000000';
          ctx.translate(logX, 415);
          ctx.rotate(-0.08);
          ctx.fillRect(0, 0, 320, 26);
          ctx.restore();
        }

        // Props: Cart, Trap, Boulder, Rope
        cart.draw(ctx, camX);
        bearTrap.draw(ctx, camX);
        boulder.draw(ctx, camX);
        rope.draw(ctx, camX);

        // 8. RENDER THE BOY
        drawTheBoy(ctx, player, camX);

        // 9. DRIFTING FOREST SPORES / FIREFLIES
        ctx.fillStyle = '#ffffff';
        for (const p of spores) {
          const px = ((p.x - camX * 0.9 + performance.now() * 0.02) % 4500);
          const py = p.y + Math.sin(p.phase + performance.now() * 0.002) * 16;
          if (px > -20 && px < VW + 20) {
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        // 10. LAYER 4: NEAR FOREGROUND BLURRED SILHOUETTES (1.4x Parallax)
        const l4X = camX * 1.4;
        ctx.fillStyle = '#000000';
        for (let x = -400; x < VW + 600; x += 650) {
          const fx = x - (l4X % 650);
          ctx.beginPath();
          ctx.moveTo(fx, 0);
          ctx.quadraticCurveTo(fx + 25, 140, fx + 15, 250);
          ctx.lineTo(fx + 38, 245);
          ctx.quadraticCurveTo(fx + 48, 140, fx + 65, 0);
          ctx.fill();
        }

        ctx.restore();
      }

      /* ==========================================================================
         THE BOY: SKELETAL SILHOUETTE ANATOMY & EYE GLOW
         ========================================================================== */
      function drawTheBoy(ctx, p, camX) {
        const px = p.x - camX;
        const py = p.y;
        const f = p.facing;

        ctx.save();
        ctx.translate(px + p.w / 2, py + p.h);

        // WAKEUP State
        if (p.state === 'WAKEUP') {
          const t = Math.min(1, p.stateTimer / 2.0);
          ctx.fillStyle = '#000000';
          // Lying in moss -> sitting up
          ctx.beginPath();
          ctx.ellipse(0, -12 * t, 22, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(f * 10 * t, -22 * t - 6, 11, 0, Math.PI * 2);
          ctx.fill();

          if (p.stateTimer > 0.6) {
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(f * 13 * t, -22 * t - 6, 2.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }
          ctx.restore();
          return;
        }

        // HANG State (Dangling from ledge edge)
        if (p.state === 'HANG') {
          ctx.fillStyle = '#000000';
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = '#000000';
          ctx.lineCap = 'round';

          // Arms reaching up gripped to the ledge
          ctx.beginPath();
          ctx.moveTo(0, -32); ctx.lineTo(f * 8, -48);
          ctx.stroke();

          // Torso hanging straight
          ctx.beginPath();
          ctx.ellipse(0, -26, 7.5, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          // Dangling legs
          ctx.beginPath();
          ctx.moveTo(-3, -16); ctx.lineTo(-2, -4); ctx.lineTo(1, 4);
          ctx.moveTo(3, -16); ctx.lineTo(4, -3); ctx.lineTo(2, 5);
          ctx.stroke();

          // Head tilted looking up
          ctx.beginPath();
          ctx.arc(f * 2, -40, 10.5, 0, Math.PI * 2);
          ctx.fill();

          // Eyes glowing
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(f * 5, -42, 2.4, 0, Math.PI * 2);
          ctx.arc(f * 8.5, -42, 2.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.restore();
          return;
        }

        // MANTLE State (Hoisting body up onto platform)
        if (p.state === 'MANTLE') {
          const prog = Math.min(1, p.stateTimer / 0.28);
          ctx.fillStyle = '#000000';
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#000000';
          ctx.lineCap = 'round';

          // Bent arms pressing down on surface
          ctx.beginPath();
          ctx.moveTo(-6, -34 - prog * 16); ctx.lineTo(f * 10, -42);
          ctx.stroke();

          // Torso rising
          ctx.beginPath();
          ctx.ellipse(f * 6 * prog, -28 - prog * 20, 8, 12, f * 0.2, 0, Math.PI * 2);
          ctx.fill();

          // Head
          ctx.beginPath();
          ctx.arc(f * 8 * prog, -44 - prog * 18, 10.5, 0, Math.PI * 2);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(f * 8 * prog + f * 4, -45 - prog * 18, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.restore();
          return;
        }

        // RUNNING / WALKING CYCLE
        const cycle = p.state === 'RUN' ? Math.sin(p.animFrame) : 0;
        const legLean = p.state === 'RUN' ? cycle * 16 : 0;
        const bodyLean = p.state === 'RUN' ? f * 6 : p.state === 'PUSH' ? f * 12 : 0;

        ctx.fillStyle = '#000000';

        // 1. LEGS
        if (p.state === 'JUMP' || p.state === 'FALL') {
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#000000';
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-4, -26); ctx.lineTo(-8, -14); ctx.lineTo(-4, -4);
          ctx.moveTo(4, -26); ctx.lineTo(8, -12); ctx.lineTo(6, -2);
          ctx.stroke();
        } else {
          ctx.lineWidth = 5.5;
          ctx.strokeStyle = '#000000';
          ctx.lineCap = 'round';
          ctx.beginPath();
          // Back leg
          ctx.moveTo(-3, -26);
          ctx.lineTo(-3 - legLean, -13);
          ctx.lineTo(-3 - legLean * 1.3, 0);
          // Front leg
          ctx.moveTo(3, -26);
          ctx.lineTo(3 + legLean, -13);
          ctx.lineTo(3 + legLean * 1.3, 0);
          ctx.stroke();
        }

        // 2. TORSO
        ctx.beginPath();
        ctx.ellipse(bodyLean * 0.5, -34, 7.5, 13, bodyLean * 0.05, 0, Math.PI * 2);
        ctx.fill();

        // 3. ARMS
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        if (p.state === 'PUSH') {
          // Straining forward against crate / trap
          ctx.moveTo(0, -40); ctx.lineTo(f * 18, -34); ctx.lineTo(f * 24, -30);
        } else if (p.state === 'ROPE') {
          // Overhead holding rope
          ctx.moveTo(0, -40); ctx.lineTo(f * 4, -58);
        } else if (p.state === 'RUN') {
          // Athletic opposing arm swing
          ctx.moveTo(0, -40); ctx.lineTo(-f * cycle * 12, -28);
        } else {
          // Relaxed standing arm
          ctx.moveTo(0, -40); ctx.lineTo(f * 3, -24);
        }
        ctx.stroke();

        // 4. HEAD WITH MESSY SILHOUETTE HAIR TUFTS
        const headY = -48 + (p.state === 'RUN' ? Math.abs(cycle) * 2 : 0);
        ctx.beginPath();
        ctx.arc(bodyLean * 0.8, headY, 11, 0, Math.PI * 2);
        ctx.fill();

        // Messy hair silhouette tufts
        ctx.beginPath();
        ctx.moveTo(bodyLean * 0.8 - 9, headY - 4);
        ctx.quadraticCurveTo(bodyLean * 0.8 - 14, headY - 14, bodyLean * 0.8 - 3, headY - 13);
        ctx.quadraticCurveTo(bodyLean * 0.8 + 6, headY - 17, bodyLean * 0.8 + 11, headY - 10);
        ctx.quadraticCurveTo(bodyLean * 0.8 + 14, headY - 4, bodyLean * 0.8 + 9, headY + 3);
        ctx.fill();

        // 5. GLOWING WHITE PIN-EYES (LIMBO'S SIGNATURE VISUAL)
        const eyeBlink = p.eyeBlinkTimer < 0.15;
        if (!eyeBlink && p.state !== 'DEAD') {
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#ffffff';
          ctx.shadowBlur = 10;

          const eyeX = bodyLean * 0.8 + f * 5.5;
          ctx.beginPath();
          ctx.arc(eyeX, headY - 1, 2.6, 0, Math.PI * 2);
          ctx.arc(eyeX + f * 4.5, headY - 1, 2.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }

        ctx.restore();
      }

      /* ==========================================================================
         GAME LOOP
         ========================================================================== */
      function loop(time) {
        const dt = Math.min(0.05, (time - lastTime) / 1000);
        lastTime = time;

        update(dt);
        render();

        requestAnimationFrame(loop);
      }

      startBtn.addEventListener('click', () => {
        initAudio();
        toggleFullscreen();
        cinematicOverlay.style.opacity = '0';
        setTimeout(() => {
          cinematicOverlay.style.display = 'none';
        }, 600);
      });

      restartBtn.addEventListener('click', () => {
        respawnPlayer();
      });

      requestAnimationFrame(loop);

      /* ==========================================================================
         GOETSCHI AI PILOT INTEGRATION
         ========================================================================== */
      if (typeof GoetschiAiPilot !== 'undefined') {
        GoetschiAiPilot.register({
          gameId: 'limbo',
          getObservation: () => {
            return [
              player.x / 4000,
              player.y / VH,
              player.vx / 300,
              player.vy / 600,
              player.isGrounded ? 1 : 0,
              player.state === 'ROPE' ? 1 : 0,
              (cart.x - player.x) / 1000,
              (spider.x - player.x) / 1000
            ];
          },
          applyAction: (actionIndex) => {
            // Actions: 0=Left, 1=Right, 2=Jump, 3=Grab
            input.left = (actionIndex === 0);
            input.right = (actionIndex === 1);
            input.jump = (actionIndex === 2);
            input.grab = (actionIndex === 3);
          },
          getScore: () => player.x,
          isGameOver: () => player.state === 'DEAD',
          restart: () => respawnPlayer()
        });
      }
    })();
  </script>
</body>
</html>
