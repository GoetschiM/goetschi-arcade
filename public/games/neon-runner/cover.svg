<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Neon Runner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2d0a4e"/>
      <stop offset="60%" stop-color="#120424"/>
      <stop offset="100%" stop-color="#05010a"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff00bb"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff00bb" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Stars -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="100" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="220" cy="50" r="1" fill="#00f0ff" opacity="0.7"/>
  <circle cx="360" cy="90" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="650" cy="60" r="1.5" fill="#ff00bb" opacity="0.8"/>
  <circle cx="720" cy="120" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="500" cy="40" r="2" fill="#00f0ff" opacity="0.4"/>

  <!-- Synthwave Sunset -->
  <circle cx="400" cy="240" r="130" fill="url(#sun)" filter="url(#glow)"/>
  <line x1="270" y1="200" x2="530" y2="200" stroke="#120424" stroke-width="4"/>
  <line x1="280" y1="220" x2="520" y2="220" stroke="#120424" stroke-width="5"/>
  <line x1="295" y1="242" x2="505" y2="242" stroke="#120424" stroke-width="6"/>
  <line x1="315" y1="266" x2="485" y2="266" stroke="#120424" stroke-width="8"/>

  <!-- Distant Cyber Skyline -->
  <path d="M0 280 L40 280 L40 240 L80 240 L80 280 L130 280 L130 220 L160 220 L160 280 L240 280 L240 250 L270 250 L270 280 L540 280 L540 230 L570 230 L570 280 L620 280 L620 210 L660 210 L660 280 L730 280 L730 245 L760 245 L760 280 L800 280 L800 500 L0 500 Z" fill="#0c0218" opacity="0.95"/>

  <!-- 3D Perspective Road Grid -->
  <polygon points="320,280 480,280 800,500 0,500" fill="#080210"/>
  <!-- Grid Lines -->
  <line x1="320" y1="280" x2="0" y2="500" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>
  <line x1="360" y1="280" x2="200" y2="500" stroke="#ff00bb" stroke-width="2.5" opacity="0.6"/>
  <line x1="400" y1="280" x2="400" y2="500" stroke="#ffe600" stroke-width="3" stroke-dasharray="25,20" opacity="0.8"/>
  <line x1="440" y1="280" x2="600" y2="500" stroke="#ff00bb" stroke-width="2.5" opacity="0.6"/>
  <line x1="480" y1="280" x2="800" y2="500" stroke="#00f0ff" stroke-width="3" opacity="0.7"/>

  <!-- Horizontal Grid Bars -->
  <line x1="280" y1="300" x2="520" y2="300" stroke="#00f0ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="230" y1="330" x2="570" y2="330" stroke="#00f0ff" stroke-width="2" opacity="0.4"/>
  <line x1="160" y1="375" x2="640" y2="375" stroke="#00f0ff" stroke-width="2.5" opacity="0.5"/>
  <line x1="70" y1="435" x2="730" y2="435" stroke="#ff00bb" stroke-width="3" opacity="0.6"/>

  <!-- Running Cyber Character (Silhouette with Neon Outline) -->
  <g transform="translate(380, 360)" filter="url(#glow)">
    <!-- Speed Lines -->
    <line x1="-80" y1="30" x2="-20" y2="30" stroke="#00f0ff" stroke-width="3" opacity="0.8"/>
    <line x1="-120" y1="50" x2="-30" y2="50" stroke="#ff00bb" stroke-width="4" opacity="0.9"/>
    <line x1="-90" y1="70" x2="-15" y2="70" stroke="#ffe600" stroke-width="3" opacity="0.8"/>

    <!-- Runner Body -->
    <circle cx="20" cy="-30" r="14" fill="#00f0ff"/>
    <path d="M12 -15 L24 25 L8 70 M24 25 L38 50 L25 80" stroke="#ff00bb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M16 0 L-10 15 L-25 35 M22 0 L40 10 L55 -5" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title Text -->
  <text x="400" y="475" text-anchor="middle" fill="#fff" font-family="'Impact', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="10" filter="url(#glow)">NEON RUNNER</text>
</svg>
