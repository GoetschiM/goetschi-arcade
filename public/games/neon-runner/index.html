<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Runner - Goetschi Arcade</title>
<meta name="theme-color" content="#06020c">
<meta name="description" content="Neon Runner - Der rasante 3-Lane Synthwave Endless Runner mit Jump & Slide, Power-Ups und Retro-Audio.">
<style>
:root{
  --pink:#ff007f;
  --cyan:#00f0ff;
  --gold:#ffe600;
  --purple:#9d4edd;
  --bg:#06020c;
  --card:rgba(18,6,32,0.92);
  --line:rgba(255,0,127,0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#game-wrap{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#canvas{
  display:block;width:100%;height:100%;max-width:540px;max-height:920px;
  background:#05010a;box-shadow:0 0 40px rgba(255,0,127,0.2);
}
/* HUD */
.hud{
  position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;z-index:10;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none;
}
.score-box{
  background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;
  display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,0.6);
}
.score-box .label{font-size:9px;color:var(--cyan);letter-spacing:0.14em;text-transform:uppercase;font-weight:700}
.score-box .val{font-size:24px;font-weight:900;color:#fff;letter-spacing:0.02em;line-height:1.1}
.hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto}
.hud-btn{
  background:var(--card);backdrop-filter:blur(8px);border:1.5px solid var(--line);
  color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;
  cursor:pointer;transition:all 0.15s ease;display:flex;align-items:center;gap:4px;
}
.hud-btn:active{transform:scale(0.94);border-color:var(--cyan)}

/* Power-Up Status Pill */
.power-pill{
  position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 58px);left:50%;transform:translateX(-50%);
  z-index:9;background:rgba(12,2,24,0.9);border:1.5px solid var(--cyan);border-radius:99px;
  padding:5px 16px;font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
  display:none;align-items:center;gap:6px;box-shadow:0 0 20px rgba(0,240,255,0.6);
}

/* Touch Controls Overlay for Mobile */
.touch-bar{
  position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:15;display:flex;gap:12px;pointer-events:auto;
}
.tbtn{
  width:64px;height:64px;border-radius:18px;background:rgba(25,8,42,0.75);
  border:2px solid rgba(255,0,127,0.5);color:#fff;font-size:22px;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);
  touch-action:none;transition:all 0.08s;
}
.tbtn:active,.tbtn.active{
  background:rgba(255,0,127,0.45);border-color:var(--cyan);color:var(--cyan);
  transform:scale(0.92);box-shadow:0 0 18px rgba(0,240,255,0.6);
}
@media(min-width:768px){
  .touch-bar{opacity:0.35;transition:opacity 0.2s}
  .touch-bar:hover{opacity:1}
}

/* Modals & Overlays */
.overlay{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(35,8,60,0.94),rgba(5,1,10,0.98));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px;
}
.panel{
  width:min(440px,100%);text-align:center;background:var(--card);border:1.5px solid var(--line);
  border-radius:22px;padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.85),0 0 30px rgba(255,0,127,0.3);
}
.logo{
  margin:0 0 6px 0;font-size:clamp(32px,8vw,44px);font-weight:950;letter-spacing:2px;
  text-transform:uppercase;color:#fff;line-height:1;font-family:'Impact',sans-serif;
}
.logo span{color:var(--pink);text-shadow:0 0 20px rgba(255,0,127,0.8)}
.subtitle{font-size:12px;color:var(--cyan);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:20px;font-weight:700}
.panel p{font-size:13.5px;color:#d0bfe0;line-height:1.55;margin:0 0 20px 0}
.play-btn{
  width:100%;border:none;background:linear-gradient(135deg,var(--pink),#7b2cbf);
  color:#fff;font-size:16px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;
  padding:15px;border-radius:99px;cursor:pointer;box-shadow:0 6px 24px rgba(255,0,127,0.5);
  transition:all 0.15s ease;
}
.play-btn:active{transform:scale(0.97)}
.stat-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-item{background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat-item .l{font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:0.1em}
.stat-item .v{font-size:22px;font-weight:900;color:#fff;margin-top:2px}
</style>
<script src="/js/goetschi-ai-pilot.js"></script>
</head>
<body>

<div id="game-wrap">
  <canvas id="canvas"></canvas>
</div>

<!-- HUD -->
<div class="hud">
  <div class="score-box">
    <span class="label">Distanz</span>
    <span class="val" id="scoreEl">0m</span>
  </div>
  <div class="hud-right">
    <div class="score-box" style="padding:6px 10px;">
      <span class="label">Kerne</span>
      <span class="val" id="coinsEl" style="color:var(--gold)">🪙 0</span>
    </div>
    <button class="hud-btn" id="audioBtn">🔊</button>
    <button class="hud-btn" id="pauseBtn">⏸</button>
  </div>
</div>

<div class="power-pill" id="powerPill">⚡ MAGNET AKTIV</div>

<!-- Touch Controls -->
<div class="touch-bar">
  <button class="tbtn" id="btnLeft">◀</button>
  <button class="tbtn" id="btnJump">▲</button>
  <button class="tbtn" id="btnSlide">▼</button>
  <button class="tbtn" id="btnRight">▶</button>
</div>

<!-- Start Overlay -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1 class="logo">NEON <span>RUNNER</span></h1>
    <div class="subtitle">Cyber Synthwave Endless Dash</div>
    <p>Surfe auf dem Neon-Highway! Weiche Hindernissen aus: <b>Springe</b> über Boden-Barrieren, <b>slide</b> unter Lasern durch und <b>wechsle Spuren</b> bei Mauern!</p>
    <div class="stat-box">
      <div class="stat-item"><div class="l">Rekord</div><div class="v" id="bestDistStart">0m</div></div>
      <div class="stat-item"><div class="l">Kerne</div><div class="v" id="bestCoinsStart">0</div></div>
    </div>
    <button class="play-btn" id="startBtn">Highway Betreten</button>
  </div>
</div>

<!-- Game Over Overlay -->
<div class="overlay" id="overOverlay" style="display:none">
  <div class="panel">
    <h1 class="logo" style="color:#ff2a55">CRASH<span>!</span></h1>
    <div class="subtitle">System Überlastet</div>
    <div class="stat-box">
      <div class="stat-item"><div class="l">Distanz</div><div class="v" id="finalDist">0m</div></div>
      <div class="stat-item"><div class="l">Kerne</div><div class="v" id="finalCoins" style="color:var(--gold)">0</div></div>
    </div>
    <button class="play-btn" id="retryBtn">Nochmal Starten</button>
  </div>
</div>

<script>
(()=>{
'use strict';

/* ==========================================================================
   WEB AUDIO SYNTHESIZER
   ========================================================================== */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type='sawtooth', duration=0.1, gainVal=0.15, slide=null) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slide), now + duration);
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e){}
}

const sfx = {
  jump() { playTone(240, 'sine', 0.18, 0.22, 650); },
  slide() { playTone(450, 'sawtooth', 0.16, 0.2, 140); },
  switchLane() { playTone(320, 'triangle', 0.08, 0.14, 480); },
  coin() { playTone(950, 'sine', 0.08, 0.18, 1400); },
  powerup() {
    [380, 560, 750, 950].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.08, 0.14), i * 40));
  },
  shieldShatter() { playTone(220, 'sawtooth', 0.28, 0.28, 40); },
  crash() { playTone(130, 'square', 0.4, 0.35, 25); }
};

/* ==========================================================================
   CANVAS & RESIZING
   ========================================================================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const coinsEl = document.getElementById('coinsEl');
const powerPill = document.getElementById('powerPill');
const startOverlay = document.getElementById('startOverlay');
const overOverlay = document.getElementById('overOverlay');
const finalDist = document.getElementById('finalDist');
const finalCoins = document.getElementById('finalCoins');
const bestDistStart = document.getElementById('bestDistStart');
const bestCoinsStart = document.getElementById('bestCoinsStart');
const startBtn = document.getElementById('startBtn');
const retryBtn = document.getElementById('retryBtn');
const audioBtn = document.getElementById('audioBtn');
const pauseBtn = document.getElementById('pauseBtn');

let W = 0, H = 0;
function resize() {
  const wrap = document.getElementById('game-wrap');
  W = canvas.width = Math.min(wrap.clientWidth, 540);
  H = canvas.height = wrap.clientHeight;
}
window.addEventListener('resize', resize);
resize();

/* ==========================================================================
   GAME STATE & LOGIC
   ========================================================================== */
let state = 'START';
let distance = 0;
let coins = 0;
let bestDistance = parseInt(localStorage.getItem('neon_runner_best') || '0', 10) || 0;
let speed = 360;
let roadZ = 0;

bestDistStart.textContent = bestDistance + 'm';

// Lanes: -1 (Left), 0 (Center), 1 (Right)
const player = {
  targetLane: 0,
  laneX: 0,
  jumpY: 0,
  jumpVy: 0,
  isJumping: false,
  isSliding: false,
  slideTimer: 0,
  hasShield: false,
  hasMagnet: false,
  magnetTimer: 0,
  tiltAngle: 0
};

let obstacles = [];
let pickups = [];
let particles = [];

/* ==========================================================================
   PERSPECTIVE PROJECTION
   Player is ALWAYS at z = 0, which corresponds to H * BASE_ROAD_RATIO
   ========================================================================== */
const HORIZON_RATIO = 0.32;
const BASE_ROAD_RATIO = 0.82;
const MAX_Z = 850;

function project(lane, z, height=0) {
  const horizonY = H * HORIZON_RATIO;
  const baseY = H * BASE_ROAD_RATIO;
  const clampedZ = Math.max(0, Math.min(MAX_Z, z));
  const t = clampedZ / MAX_Z; // 0 at player (near), 1 at horizon (far)

  const p = Math.pow(1 - t, 2.2);
  const scale = 0.16 + 0.84 * p;

  const trackWidthAtHorizon = W * 0.18;
  const trackWidthAtBase = W * 0.88;
  const curTrackWidth = trackWidthAtHorizon + (trackWidthAtBase - trackWidthAtHorizon) * (1 - t);

  const laneSpan = (curTrackWidth / 3);
  const screenX = W / 2 + (lane * laneSpan);
  const screenY = horizonY + (baseY - horizonY) * (1 - t) - (height * scale);

  return { x: screenX, y: screenY, scale };
}

/* ==========================================================================
   SPAWN PATTERNS (IMMEDIATE & CONTINUOUS STREAM)
   ========================================================================== */
function spawnAtZ(targetZ) {
  const lane = Math.floor(Math.random() * 3) - 1;
  const rand = Math.random();

  if (rand < 0.38) {
    // Low hurdle (Jump required)
    obstacles.push({ lane, z: targetZ, type: 'HURDLE', w: 60, h: 26 });
  } else if (rand < 0.72) {
    // High laser beam (Slide required)
    obstacles.push({ lane, z: targetZ, type: 'LASER', w: 75, h: 65 });
  } else {
    // Tall solid barrier (Lane change required)
    obstacles.push({ lane, z: targetZ, type: 'WALL', w: 65, h: 90 });
    if (Math.random() < 0.4 && distance > 100) {
      const otherLane = (lane === 0) ? (Math.random() < 0.5 ? -1 : 1) : 0;
      obstacles.push({ lane: otherLane, z: targetZ, type: 'WALL', w: 65, h: 90 });
    }
  }

  // Energy Cells (Coins) on a different lane
  const coinLane = (lane === 0) ? (Math.random() < 0.5 ? -1 : 1) : 0;
  for (let i = 0; i < 3; i++) {
    pickups.push({ lane: coinLane, z: targetZ - 60 + i * 45, type: 'COIN' });
  }

  // Rare powerup
  if (Math.random() < 0.18) {
    const pLane = Math.floor(Math.random() * 3) - 1;
    pickups.push({ lane: pLane, z: targetZ + 90, type: Math.random() < 0.5 ? 'SHIELD' : 'MAGNET' });
  }
}

function resetGame() {
  distance = 0;
  coins = 0;
  speed = 360;
  roadZ = 0;
  player.targetLane = 0;
  player.laneX = 0;
  player.jumpY = 0;
  player.jumpVy = 0;
  player.isJumping = false;
  player.isSliding = false;
  player.slideTimer = 0;
  player.hasShield = false;
  player.hasMagnet = false;
  player.magnetTimer = 0;
  player.tiltAngle = 0;

  obstacles = [];
  pickups = [];
  particles = [];

  scoreEl.textContent = '0m';
  coinsEl.textContent = '🪙 0';
  powerPill.style.display = 'none';

  // PRE-POPULATE A STREAM OF OBSTACLES IMMEDIATELY!
  // The player sees coins & hurdles right from meter 1!
  spawnAtZ(240);
  spawnAtZ(440);
  spawnAtZ(640);
  spawnAtZ(840);
}

function startGame() {
  initAudio();
  resetGame();
  state = 'PLAYING';
  startOverlay.style.display = 'none';
  overOverlay.style.display = 'none';
  pauseBtn.textContent = '⏸';
}

function gameOver() {
  state = 'GAMEOVER';
  sfx.crash();
  if (distance > bestDistance) {
    bestDistance = distance;
    localStorage.setItem('neon_runner_best', bestDistance);
  }
  finalDist.textContent = distance + 'm';
  finalCoins.textContent = coins;
  overOverlay.style.display = 'flex';
}

function switchLane(dir) {
  if (state !== 'PLAYING') return;
  const next = Math.max(-1, Math.min(1, player.targetLane + dir));
  if (next !== player.targetLane) {
    player.targetLane = next;
    sfx.switchLane();
  }
}

function jump() {
  if (state !== 'PLAYING') return;
  if (!player.isJumping && !player.isSliding) {
    player.isJumping = true;
    player.jumpVy = -680;
    sfx.jump();
  }
}

function slide() {
  if (state !== 'PLAYING') return;
  if (player.isJumping) {
    player.jumpVy = 900;
  } else if (!player.isSliding) {
    player.isSliding = true;
    player.slideTimer = 0.65;
    sfx.slide();
  }
}

/* ==========================================================================
   UPDATE LOOP
   ========================================================================== */
let lastTime = performance.now();

function update(dt) {
  if (state !== 'PLAYING') return;

  speed = Math.min(880, 360 + distance * 0.45);
  distance += Math.round(speed * dt * 0.08);
  scoreEl.textContent = distance + 'm';

  roadZ = (roadZ + speed * dt * 0.45) % 100;

  // Smooth lane interpolation & body carving tilt
  const targetX = player.targetLane;
  const laneDiff = targetX - player.laneX;
  player.laneX += laneDiff * Math.min(1, 15 * dt);
  player.tiltAngle = laneDiff * 0.45;

  // Jump physics
  if (player.isJumping) {
    player.jumpY += player.jumpVy * dt;
    player.jumpVy += 1900 * dt;
    if (player.jumpY >= 0) {
      player.jumpY = 0;
      player.jumpVy = 0;
      player.isJumping = false;
    }
  }

  // Slide timer
  if (player.isSliding) {
    player.slideTimer -= dt;
    if (player.slideTimer <= 0) player.isSliding = false;
  }

  // Magnet timer
  if (player.hasMagnet) {
    player.magnetTimer -= dt;
    if (player.magnetTimer <= 0) {
      player.hasMagnet = false;
      powerPill.style.display = 'none';
    }
  }

  // CONTINUOUS SPAWN QUEUE:
  // Find highest z among all existing obstacles. If none or highest < 700, spawn at 850!
  let maxZ = 0;
  for (const o of obstacles) {
    if (o.z > maxZ) maxZ = o.z;
  }
  if (maxZ < 680) {
    spawnAtZ(MAX_Z);
  }

  // Move Obstacles (towards camera)
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.z -= speed * dt;

    // Collision check near player (z ≈ 0 to 40)
    if (o.z > -15 && o.z < 45) {
      const laneDist = Math.abs(player.laneX - o.lane);
      if (laneDist < 0.55) {
        let hit = false;
        if (o.type === 'HURDLE' && player.jumpY > -38) hit = true;
        else if (o.type === 'LASER' && !player.isSliding) hit = true;
        else if (o.type === 'WALL') hit = true;

        if (hit) {
          if (player.hasShield) {
            player.hasShield = false;
            sfx.shieldShatter();
            powerPill.style.display = 'none';
            obstacles.splice(i, 1);
            continue;
          } else {
            gameOver();
            return;
          }
        }
      }
    }

    if (o.z < -60) obstacles.splice(i, 1);
  }

  // Move Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.z -= speed * dt;

    // Magnet suction
    if (player.hasMagnet && p.z > 0 && p.z < 350) {
      p.lane += (player.laneX - p.lane) * 0.18;
    }

    if (p.z > -20 && p.z < 50) {
      const laneDist = Math.abs(player.laneX - p.lane);
      if (laneDist < 0.6) {
        if (p.type === 'COIN') {
          coins++;
          coinsEl.textContent = '🪙 ' + coins;
          sfx.coin();
        } else if (p.type === 'SHIELD') {
          player.hasShield = true;
          powerPill.textContent = '🛡️ SCHILD AKTIV';
          powerPill.style.display = 'flex';
          sfx.powerup();
        } else if (p.type === 'MAGNET') {
          player.hasMagnet = true;
          player.magnetTimer = 10.0;
          powerPill.textContent = '🧲 MAGNET AKTIV';
          powerPill.style.display = 'flex';
          sfx.powerup();
        }
        pickups.splice(i, 1);
        continue;
      }
    }

    if (p.z < -60) pickups.splice(i, 1);
  }

  // Dual Thruster exhaust sparks shooting BACKWARDS towards camera
  const charPos = project(player.laneX, 0, -player.jumpY);
  if (Math.random() < 0.85) {
    particles.push({
      x: charPos.x - 12 + (Math.random() - 0.5) * 6,
      y: charPos.y + 6,
      vx: (Math.random() - 0.5) * 15,
      vy: Math.random() * 30 + 20, // shoots down/towards player
      life: 0.28,
      col: player.isSliding ? '#ff00bb' : '#00f0ff'
    });
    particles.push({
      x: charPos.x + 12 + (Math.random() - 0.5) * 6,
      y: charPos.y + 6,
      vx: (Math.random() - 0.5) * 15,
      vy: Math.random() * 30 + 20,
      life: 0.28,
      col: player.isSliding ? '#ff00bb' : '#00f0ff'
    });
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

/* ==========================================================================
   RENDER LOOP
   ========================================================================== */
function draw() {
  ctx.clearRect(0, 0, W, H);

  const horizonY = H * HORIZON_RATIO;
  const baseY = H * BASE_ROAD_RATIO;

  // 1. Synthwave Sky with Sunset
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGrad.addColorStop(0, '#100322');
  skyGrad.addColorStop(1, '#3b064e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, horizonY);

  const sunR = Math.min(W * 0.24, 95);
  const sunGrad = ctx.createLinearGradient(W/2, horizonY - sunR, W/2, horizonY);
  sunGrad.addColorStop(0, '#ff007f');
  sunGrad.addColorStop(0.5, '#ff00bb');
  sunGrad.addColorStop(1, '#ffe600');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(W / 2, horizonY, sunR, Math.PI, 0);
  ctx.fill();

  // Sun stripes
  ctx.fillStyle = '#100322';
  for (let i = 1; i <= 5; i++) {
    const sy = horizonY - (sunR * 0.16 * i);
    ctx.fillRect(W / 2 - sunR, sy, sunR * 2, 2 + i);
  }

  // Skyline
  ctx.fillStyle = '#0a0216';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  ctx.lineTo(25, horizonY - 22); ctx.lineTo(55, horizonY - 22); ctx.lineTo(55, horizonY);
  ctx.lineTo(95, horizonY - 38); ctx.lineTo(125, horizonY - 38); ctx.lineTo(125, horizonY);
  ctx.lineTo(W - 135, horizonY); ctx.lineTo(W - 135, horizonY - 32); ctx.lineTo(W - 95, horizonY - 32);
  ctx.lineTo(W - 65, horizonY - 18); ctx.lineTo(W - 35, horizonY - 18); ctx.lineTo(W, horizonY);
  ctx.fill();

  // Horizon Neon Glow
  ctx.strokeStyle = '#ff007f';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff007f';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  ctx.lineTo(W, horizonY);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 2. Highway Floor
  const pFarLeft = project(-1.5, MAX_Z);
  const pFarRight = project(1.5, MAX_Z);
  const pNearLeft = project(-1.5, 0);
  const pNearRight = project(1.5, 0);

  ctx.fillStyle = '#06010e';
  ctx.beginPath();
  ctx.moveTo(pFarLeft.x, pFarLeft.y);
  ctx.lineTo(pFarRight.x, pFarRight.y);
  ctx.lineTo(pNearRight.x, pNearRight.y + 60);
  ctx.lineTo(pNearLeft.x, pNearLeft.y + 60);
  ctx.fill();

  // Lane Dividers
  const lanes = [-1.5, -0.5, 0.5, 1.5];
  for (let l of lanes) {
    const f = project(l, MAX_Z);
    const n = project(l, 0);
    const isEdge = (l === -1.5 || l === 1.5);
    ctx.strokeStyle = isEdge ? '#ff007f' : 'rgba(0, 240, 255, 0.45)';
    ctx.lineWidth = isEdge ? 3.5 : 2;
    ctx.shadowColor = isEdge ? '#ff007f' : '#00f0ff';
    ctx.shadowBlur = isEdge ? 12 : 6;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(n.x, n.y + 60);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Moving Horizontal Road Stripes
  for (let z = (roadZ % 40); z < MAX_Z; z += 40) {
    const left = project(-1.5, z);
    const right = project(1.5, z);
    const alpha = Math.max(0, 1 - (z / MAX_Z));
    ctx.strokeStyle = `rgba(255, 0, 187, ${alpha * 0.75})`;
    ctx.lineWidth = 1.5 + (1 - (z / MAX_Z)) * 3.5;
    ctx.beginPath();
    ctx.moveTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.stroke();
  }

  // 3. Render Pickups and Obstacles (Sorted back-to-front by depth z)
  const items = [
    ...pickups.map(p => ({ ...p, isPickup: true })),
    ...obstacles.map(o => ({ ...o, isPickup: false }))
  ].sort((a, b) => b.z - a.z);

  for (const ent of items) {
    const pos = project(ent.lane, ent.z);
    if (pos.scale <= 0) continue;

    if (ent.isPickup) {
      const r = Math.max(5, 16 * pos.scale);
      if (ent.type === 'COIN') {
        ctx.fillStyle = '#ffe600';
        ctx.shadowColor = '#ffe600';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 20 * pos.scale, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 20 * pos.scale, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (ent.type === 'SHIELD') {
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 14;
        ctx.fillRect(pos.x - r, pos.y - 25 * pos.scale, r * 2, r * 2);
      } else if (ent.type === 'MAGNET') {
        ctx.fillStyle = '#ff00bb';
        ctx.shadowColor = '#ff00bb';
        ctx.shadowBlur = 14;
        ctx.fillRect(pos.x - r, pos.y - 25 * pos.scale, r * 2, r * 2);
      }
      ctx.shadowBlur = 0;
    } else {
      const w = ent.w * pos.scale;
      const h = ent.h * pos.scale;

      if (ent.type === 'HURDLE') {
        ctx.fillStyle = '#ff0055';
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2 * pos.scale;
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 14;
        ctx.fillRect(pos.x - w / 2, pos.y - h, w, h);
        ctx.strokeRect(pos.x - w / 2, pos.y - h, w, h);
        ctx.fillStyle = '#ffe600';
        for (let s = -w/2 + 6; s < w/2; s += 16 * pos.scale) {
          ctx.fillRect(pos.x + s, pos.y - h, 6 * pos.scale, h);
        }
      } else if (ent.type === 'LASER') {
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 14;
        const pillarW = 8 * pos.scale;
        ctx.fillRect(pos.x - w/2, pos.y - h, pillarW, h);
        ctx.fillRect(pos.x + w/2 - pillarW, pos.y - h, pillarW, h);
        ctx.fillStyle = '#ff00bb';
        ctx.shadowColor = '#ff00bb';
        ctx.shadowBlur = 18;
        ctx.fillRect(pos.x - w/2, pos.y - h, w, 14 * pos.scale);
      } else if (ent.type === 'WALL') {
        ctx.fillStyle = '#6a0dad';
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3 * pos.scale;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 16;
        ctx.fillRect(pos.x - w/2, pos.y - h, w, h);
        ctx.strokeRect(pos.x - w/2, pos.y - h, w, h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(pos.x - 4 * pos.scale, pos.y - h * 0.7, 8 * pos.scale, h * 0.4);
      }
      ctx.shadowBlur = 0;
    }
  }

  // 4. Exhaust Particles
  for (const pt of particles) {
    ctx.fillStyle = pt.col;
    ctx.globalAlpha = Math.max(0, pt.life / 0.28);
    ctx.fillRect(pt.x - 3, pt.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1.0;

  // 5. DRAW CYBER HOVERBOARDER FROM BEHIND (RACING INTO THE SCREEN!)
  const charPos = project(player.laneX, 0, -player.jumpY);

  ctx.save();
  ctx.translate(charPos.x, charPos.y);
  ctx.rotate(player.tiltAngle);

  // Ground Shadow (anchored to track beneath player)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.beginPath();
  ctx.ellipse(0, 8 + player.jumpY * 0.2, 38, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shield Aura
  if (player.hasShield) {
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(0, -38, 50, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // HOVERBOARD (Viewed from Behind: Foreshortened perspective pointing away into the screen)
  // Deck: Wider near camera at bottom (y = 6), narrower forward into screen (y = -18)
  ctx.fillStyle = '#14062a';
  ctx.strokeStyle = '#ff007f';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#ff007f';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(-22, 6);   // rear left
  ctx.lineTo(-12, -18); // front left (narrower)
  ctx.lineTo(12, -18);  // front right
  ctx.lineTo(22, 6);    // rear right
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Neon Deck Inlay Stripes
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, 4); ctx.lineTo(-8, -14);
  ctx.moveTo(14, 4); ctx.lineTo(8, -14);
  ctx.stroke();

  // Twin Rear Rocket Thrusters (facing towards player camera)
  ctx.fillStyle = '#00f0ff';
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 16;
  ctx.fillRect(-18, 5, 10, 8); // left thruster nozzle
  ctx.fillRect(8, 5, 10, 8);  // right thruster nozzle

  // Thruster Glow Core
  ctx.fillStyle = '#fff';
  ctx.fillRect(-15, 7, 4, 4);
  ctx.fillRect(11, 7, 4, 4);

  // SKATER CHARACTER (REAR VIEW - RACING FORWARD AWAY FROM CAMERA)
  if (player.isSliding) {
    // Low Aerodynamic Tuck / Slide Stance
    ctx.fillStyle = '#1e083c';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(-22, -26, 44, 20, 6);
    ctx.fill();
    ctx.stroke();

    // Glowing Cyber Spine on Back
    ctx.fillStyle = '#ff00bb';
    ctx.shadowColor = '#ff00bb';
    ctx.shadowBlur = 10;
    ctx.fillRect(-4, -24, 8, 16);

    // Helmet (Rear)
    ctx.fillStyle = '#0e031c';
    ctx.beginPath();
    ctx.arc(0, -32, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else {
    // Surfing / Upright Stance (Viewed from Behind)
    // Feet & Lower Legs (firmly planted on board)
    ctx.fillStyle = '#ff007f';
    ctx.shadowColor = '#ff007f';
    ctx.shadowBlur = 8;
    ctx.fillRect(-16, -24, 10, 24); // left leg
    ctx.fillRect(6, -24, 10, 24);   // right leg

    // Torso / Cyber Jacket (Back View)
    ctx.fillStyle = '#14062a';
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 14;
    ctx.fillRect(-16, -56, 32, 34);
    ctx.strokeRect(-16, -56, 32, 34);

    // Glowing Cybernetic Spine on Back
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    for (let s = 0; s < 4; s++) {
      ctx.fillRect(-4, -52 + s * 8, 8, 5);
    }

    // Shoulder Armor Pads
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(-22, -56, 8, 12);
    ctx.fillRect(14, -56, 8, 12);

    // Helmet (Viewed from BACK)
    ctx.fillStyle = '#0b0218';
    ctx.strokeStyle = '#ff007f';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#ff007f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, -68, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Rear Helmet LED Strip
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 12;
    ctx.fillRect(-10, -70, 20, 4);

    // Futuristic Antenna / Ponytail Light on Helmet Top
    ctx.fillStyle = '#ff00bb';
    ctx.fillRect(-2, -86, 4, 6);
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

function gameLoop(time) {
  const dt = Math.min(0.08, (time - lastTime) / 1000);
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* ==========================================================================
   INPUTS & EVENT LISTENERS
   ========================================================================== */
window.addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); switchLane(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); switchLane(1); }
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { e.preventDefault(); jump(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slide(); }
  else if (e.code === 'KeyP') { togglePause(); }
  else if (e.code === 'KeyM') { toggleAudio(); }
});

// Touch Swipes
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', e => {
  initAudio();
  if (e.touches.length > 0) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

window.addEventListener('touchend', e => {
  if (e.changedTouches.length > 0) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);

    if (Math.max(absX, absY) > 28) {
      if (absX > absY) {
        switchLane(dx > 0 ? 1 : -1);
      } else {
        if (dy < 0) jump();
        else slide();
      }
    }
  }
}, { passive: true });

// Touch Buttons
document.getElementById('btnLeft').addEventListener('click', () => switchLane(-1));
document.getElementById('btnRight').addEventListener('click', () => switchLane(1));
document.getElementById('btnJump').addEventListener('click', jump);
document.getElementById('btnSlide').addEventListener('click', slide);

function togglePause() {
  if (state === 'PLAYING') state = 'PAUSED';
  else if (state === 'PAUSED') state = 'PLAYING';
  pauseBtn.textContent = (state === 'PAUSED') ? '▶' : '⏸';
}

function toggleAudio() {
  soundEnabled = !soundEnabled;
  audioBtn.textContent = soundEnabled ? '🔊' : '🔇';
}

startBtn.addEventListener('click', startGame);
retryBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
audioBtn.addEventListener('click', toggleAudio);

/* ==========================================================================
   GOETSCHI AI PILOT REGISTRATION
   ========================================================================== */
if (window.GoetschiAIPilot) {
  window.GoetschiAIPilot.register({
    interval: 50,
    getObs: function() {
      if (state !== 'PLAYING') return null;
      let closest = null;
      let minDist = 9999;
      for (const o of obstacles) {
        if (o.z > 0 && o.z < minDist) {
          minDist = o.z;
          closest = o;
        }
      }

      const typeCode = closest ? (closest.type === 'HURDLE' ? 0.0 : (closest.type === 'LASER' ? 0.5 : 1.0)) : 0.0;
      const obsLane = closest ? closest.lane : 0;
      const obsDistNorm = closest ? Math.min(1.0, closest.z / MAX_Z) : 1.0;

      return [
        player.targetLane,
        player.isJumping ? 1.0 : 0.0,
        player.isSliding ? 1.0 : 0.0,
        obsDistNorm,
        obsLane,
        typeCode,
        Math.min(1.0, speed / 880.0),
        player.hasShield ? 1.0 : 0.0
      ];
    },
    applyAction: function(act) {
      if (state !== 'PLAYING') {
        startGame();
        return;
      }
      if (act === 1) switchLane(-1);
      else if (act === 2) switchLane(1);
      else if (act === 3) jump();
      else if (act === 4) slide();
    },
    isDead: function() {
      return state === 'GAMEOVER' || state === 'START';
    },
    restart: function() {
      startGame();
    }
  });
}

})();
</script>
