<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Iron Dominion">
  <defs>
    <radialGradient id="bg"><stop stop-color="#1b1204"/><stop offset="1" stop-color="#070502"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#ff8a3d" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/><rect width="800" height="500" fill="url(#grid)"/>

  <!-- Erzfeld links -->
  <g filter="url(#glow)">
    <polygon points="118,208 138,180 168,190 168,224 138,238" fill="#ffb85e"/>
    <polygon points="150,238 168,212 196,222 194,254 164,264" fill="#ff8a3d"/>
    <polygon points="96,246 116,222 140,232 138,262 110,272" fill="#e8c34a"/>
  </g>

  <!-- Hexagon-Emblem mit Panzer-Silhouette -->
  <g transform="translate(430,238)" filter="url(#glow)">
    <polygon points="0,-118 102,-59 102,59 0,118 -102,59 -102,-59" fill="#171009" stroke="#ff8a3d" stroke-width="4"/>
    <polygon points="0,-96 84,-48 84,48 0,96 -84,48 -84,-48" fill="none" stroke="#ff8a3d" stroke-opacity=".45" stroke-width="2"/>
    <g fill="#ff8a3d">
      <rect x="-46" y="-6" width="92" height="40" rx="6"/>
      <rect x="-30" y="-30" width="46" height="28" rx="5"/>
      <rect x="8" y="-14" width="46" height="9" rx="4"/>
      <circle cx="-30" cy="40" r="14"/><circle cx="30" cy="40" r="14"/>
    </g>
  </g>

  <!-- Panzerspur rechts -->
  <g stroke="#ff8a3d" stroke-opacity=".5" stroke-width="6" stroke-dasharray="14 10" fill="none">
    <path d="M620 120 L700 200 L680 340"/>
  </g>

  <text x="400" y="452" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-weight="900" font-size="46" letter-spacing="7">IRON DOMINION</text>
</svg>
