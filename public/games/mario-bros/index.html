<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
:root{
  --sky:#5c94fc;
  --gold:#fcd828;
  --red:#e52521;
  --green:#00a800;
  --bg:#070a10;
  --panel:rgba(12,18,28,0.92);
  --line:rgba(255,255,255,0.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:#fff;
  font-family:'Courier New',Courier,monospace,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#game-app{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
#canvas-container{
  position:relative;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 40px rgba(0,0,0,0.9);border:2px solid #1c2838;border-radius:10px;overflow:hidden;
  background:#000;
}
#canvas{
  display:block;image-rendering:pixelated;image-rendering:crisp-edges;
}

/* Retro HUD Top */
.hud-bar{
  position:fixed;top:max(8px,env(safe-area-inset-top));left:100px;right:16px;z-index:10;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none;
}
.hud-stats{
  display:flex;align-items:center;gap:14px;font-weight:900;font-size:13px;
  text-shadow:2px 2px 0 #000;letter-spacing:0.04em;
}
.hud-stats .item{display:flex;flex-direction:column;line-height:1.1}
.hud-stats .lbl{font-size:9px;color:var(--gold);text-transform:uppercase}
.hud-stats .val{font-size:14px;color:#fff}
.hud-right{display:flex;gap:6px;pointer-events:auto}
.hud-btn{
  background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);
  color:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;
  cursor:pointer;transition:all 0.15s ease;
}
.hud-btn:active{transform:scale(0.92);border-color:var(--gold)}

/* Mobile Touch Controls */
.touch-container{
  position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;
  display:flex;justify-content:space-between;padding:0 14px;z-index:15;pointer-events:none;
}
.touch-dpad{
  display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:6px;
  pointer-events:auto;
}
.touch-actions{
  display:flex;align-items:flex-end;gap:12px;pointer-events:auto;
}
.tbtn{
  background:rgba(18,28,42,0.85);border:2px solid rgba(255,255,255,0.35);
  border-radius:14px;color:#fff;font-weight:900;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;backdrop-filter:blur(6px);touch-action:none;transition:all 0.08s;
}
.tbtn:active,.tbtn.active{
  background:rgba(229,37,33,0.7);border-color:#ffcc00;color:#fff;
  transform:scale(0.92);box-shadow:0 0 16px rgba(229,37,33,0.6);
}
.tbtn-left{grid-column:1;grid-row:2;width:54px;height:54px}
.tbtn-down{grid-column:2;grid-row:2;width:54px;height:54px}
.tbtn-right{grid-column:3;grid-row:2;width:54px;height:54px}
.tbtn-a{width:64px;height:64px;border-radius:50%;background:rgba(229,37,33,0.9);border-color:#ffaa00;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,0.6)}
.tbtn-b{width:56px;height:56px;border-radius:50%;background:rgba(252,152,56,0.9);border-color:#ffe600;font-size:14px;margin-bottom:4px;box-shadow:0 4px 14px rgba(0,0,0,0.6)}

/* Level Select & Overlays */
.overlay{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(16,28,45,0.96),rgba(5,10,18,0.99));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:16px;
}
.panel{
  width:min(500px,100%);max-height:92vh;overflow-y:auto;text-align:center;
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,0.85);
}
.logo{
  margin:0 0 4px 0;font-family:'Impact',sans-serif;font-size:clamp(26px,6.5vw,38px);
  font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#ffe600;
  text-shadow:3px 3px 0 var(--red),-2px -2px 0 #000;line-height:1;
}
.subtitle{font-size:11px;color:var(--gold);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:14px;font-weight:800}

/* Level Grid (20 Levels) */
.level-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0;
}
.lvl-card{
  background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:10px 4px;cursor:pointer;transition:all 0.15s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.lvl-card:hover,.lvl-card:focus{
  background:rgba(252,216,40,0.2);border-color:var(--gold);transform:translateY(-2px);
}
.lvl-card.locked{
  opacity:0.35;cursor:not-allowed;border-color:rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);
}
.lvl-card .world-name{font-size:8.5px;color:#a0b8cc;text-transform:uppercase}
.lvl-card .num{font-size:16px;font-weight:900;color:#fff}
.lvl-card .theme-dot{width:8px;height:8px;border-radius:50%;margin-top:2px}

.play-btn{
  width:100%;border:none;background:linear-gradient(135deg,var(--red),#ff7700);
  color:#fff;font-size:15px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;
  padding:13px;border-radius:99px;cursor:pointer;box-shadow:0 6px 24px rgba(229,37,33,0.5);
  transition:all 0.15s ease;margin-top:8px;
}
.play-btn:active{transform:scale(0.97)}

@media(min-width:768px){
  .touch-container{opacity:0.35;transition:opacity 0.2s}
  .touch-container:hover{opacity:1}
}

<script>
(()=>{
'use strict';

/* ==========================================================================
   8-BIT CHIPTUNE SYNTHESIZER
   ========================================================================== */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type = 'square', duration = 0.1, gainVal = 0.12, slide = null) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slide), now + duration);
    gain.gain.setValueAtTime(gainVal, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch(e){}
}

const sfx = {
  jump() { playTone(160, 'square', 0.16, 0.14, 450); },
  superJump() { playTone(220, 'square', 0.22, 0.15, 650); },
  coin() {
    playTone(987.77, 'square', 0.08, 0.12);
    setTimeout(() => playTone(1318.51, 'square', 0.28, 0.14), 70);
  },
  stomp() { playTone(180, 'triangle', 0.12, 0.2, 50); },
  kick() { playTone(220, 'sawtooth', 0.15, 0.2, 60); },
  fireball() { playTone(580, 'triangle', 0.1, 0.14, 220); },
  powerupAppear() {
    [330, 392, 659, 523, 587, 784].forEach((f, i) => {
      setTimeout(() => playTone(f, 'triangle', 0.08, 0.1), i * 50);
    });
  },
  powerup() {
    [330, 392, 659, 523, 587, 784, 880, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.09, 0.14), i * 45);
    });
  },
  bump() { playTone(90, 'triangle', 0.1, 0.2, 40); },
  breakBrick() { playTone(150, 'sawtooth', 0.15, 0.18, 30); },
  flagpole() {
    [523, 587, 659, 784, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.25, 0.15), i * 90);
    });
  },
  die() {
    [440, 415, 392, 370, 349, 330, 311, 293].forEach((f, i) => {
      setTimeout(() => playTone(f, 'sawtooth', 0.15, 0.18), i * 65);
    });
  },
  winLevel() {
    [523, 659, 784, 1046, 784, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.2, 0.15), i * 80);
    });
  }
};

/* ==========================================================================
   20 WORLDS & THEMES DEFINITIONS
   ========================================================================== */
const THEMES = {
  GRASS: { bg: '#5c94fc', hill: '#00a800', ground: '#c84c0c', grass: '#00c800', pipe: '#00a800', name: 'Grasland', dot: '#00ff88' },
  DESERT: { bg: '#e8b870', hill: '#c89040', ground: '#d09848', grass: '#e0b060', pipe: '#908030', name: 'Wüste', dot: '#ffd700' },
  ICE: { bg: '#70a0d8', hill: '#a0d8f0', ground: '#5080b0', grass: '#d8f0ff', pipe: '#3070a0', name: 'Eiswelt', dot: '#00f0ff' },
  SKY: { bg: '#183060', hill: '#284888', ground: '#3860b0', grass: '#6890e0', pipe: '#5080d0', name: 'Himmel', dot: '#c74dff' },
  LAVA: { bg: '#200808', hill: '#481010', ground: '#501818', grass: '#ff4010', pipe: '#702010', name: 'Lava-Burg', dot: '#ff2a55' }
};

// 20 Levels (5 Worlds x 4 Levels)
const LEVELS = [
  // World 1: Grassland
  { id: 1, world: '1-1', theme: 'GRASS', length: 140, enemies: 8, pits: 2, time: 300, name: 'Gras-Hügel' },
  { id: 2, world: '1-2', theme: 'GRASS', length: 150, enemies: 10, pits: 3, time: 300, name: 'Röhren-Garten' },
  { id: 3, world: '1-3', theme: 'GRASS', length: 160, enemies: 12, pits: 4, time: 280, name: 'Baumkronen' },
  { id: 4, world: '1-4', theme: 'GRASS', length: 170, enemies: 14, pits: 4, time: 260, boss: true, name: 'Gras-Festung' },
  // World 2: Desert
  { id: 5, world: '2-1', theme: 'DESERT', length: 150, enemies: 11, pits: 3, time: 300, name: 'Dünen-Tal' },
  { id: 6, world: '2-2', theme: 'DESERT', length: 160, enemies: 13, pits: 4, time: 280, name: 'Pyramiden-Höhle' },
  { id: 7, world: '2-3', theme: 'DESERT', length: 170, enemies: 15, pits: 5, time: 270, name: 'Oasen-Stufen' },
  { id: 8, world: '2-4', theme: 'DESERT', length: 180, enemies: 16, pits: 5, time: 250, boss: true, name: 'Wüsten-Bastion' },
  // World 3: Ice
  { id: 9, world: '3-1', theme: 'ICE', length: 150, enemies: 12, pits: 3, time: 290, name: 'Frost-Piste' },
  { id: 10, world: '3-2', theme: 'ICE', length: 160, enemies: 14, pits: 4, time: 280, name: 'Gletscher-Kaverne' },
  { id: 11, world: '3-3', theme: 'ICE', length: 170, enemies: 16, pits: 5, time: 260, name: 'Eis-Spitzen' },
  { id: 12, world: '3-4', theme: 'ICE', length: 180, enemies: 18, pits: 6, time: 240, boss: true, name: 'Frost-Zitadelle' },
  // World 4: Sky
  { id: 13, world: '4-1', theme: 'SKY', length: 160, enemies: 14, pits: 5, time: 280, name: 'Wolken-Inseln' },
  { id: 14, world: '4-2', theme: 'SKY', length: 170, enemies: 16, pits: 6, time: 270, name: 'Sternen-Pfad' },
  { id: 15, world: '4-3', theme: 'SKY', length: 180, enemies: 18, pits: 7, time: 250, name: 'Himmels-Brücke' },
  { id: 16, world: '4-4', theme: 'SKY', length: 190, enemies: 20, pits: 7, time: 230, boss: true, name: 'Luftschiff-Galeere' },
  // World 5: Lava
  { id: 17, world: '5-1', theme: 'LAVA', length: 170, enemies: 16, pits: 5, time: 260, name: 'Vulkan-Grat' },
  { id: 18, world: '5-2', theme: 'LAVA', length: 180, enemies: 18, pits: 6, time: 250, name: 'Magma-Schlund' },
  { id: 19, world: '5-3', theme: 'LAVA', length: 190, enemies: 20, pits: 8, time: 230, name: 'Feuer-Säulen' },
  { id: 20, world: '5-4', theme: 'LAVA', length: 210, enemies: 24, pits: 8, time: 220, boss: true, name: 'Bowsers Thronsaal' }
];

let unlockedLevel = 1;
try { unlockedLevel = parseInt(localStorage.getItem('mario_unlocked_lvl') || '1', 10) || 1; } catch(e){}

/* ==========================================================================
   CANVAS & SIZING
   ========================================================================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const coinsEl = document.getElementById('coinsEl');
const worldEl = document.getElementById('worldEl');
const timeEl = document.getElementById('timeEl');
const livesEl = document.getElementById('livesEl');
const overlay = document.getElementById('overlay');
const levelGrid = document.getElementById('levelGrid');
const startBtn = document.getElementById('startBtn');
const audioBtn = document.getElementById('audioBtn');
const pauseBtn = document.getElementById('pauseBtn');
const levelSelectBtn = document.getElementById('levelSelectBtn');

const TILE_SIZE = 16;
const WORLD_TILES_H = 14;
const VIEW_W = 256;
const VIEW_H = WORLD_TILES_H * TILE_SIZE; // 224

let scale = 2;

function resize() {
  const maxW = Math.min(window.innerWidth - 16, 768);
  const maxH = Math.min(window.innerHeight - 130, 520);
  scale = Math.floor(Math.min(maxW / VIEW_W, maxH / VIEW_H));
  scale = Math.max(1, Math.min(scale, 3));

  canvas.width = VIEW_W * scale;
  canvas.height = VIEW_H * scale;
  canvas.style.width = (VIEW_W * scale) + 'px';
  canvas.style.height = (VIEW_H * scale) + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ==========================================================================
   GAME STATE & ENTITIES
   ========================================================================== */
let currentLevelIndex = 0;
let currentTheme = THEMES.GRASS;
let state = 'OVERLAY'; // OVERLAY, PLAYING, WINNING, DYING, GAMEOVER
let score = 0;
let coins = 0;
let lives = 3;
let timeLeft = 300;
let cameraX = 0;

let tileMap = [];
let blocks = [];
let items = [];
let enemies = [];
let fireballs = [];
let particles = [];
let floatingTexts = [];
let castleX = 0;
let flagPoleX = 0;

const keys = { left: false, right: false, down: false, jump: false, run: false };

class Player {
  constructor() {
    this.x = 40;
    this.y = 12 * TILE_SIZE;
    this.vx = 0;
    this.vy = 0;
    this.w = 12;
    this.h = 16;
    this.powerState = 0; // 0 small, 1 super, 2 fire
    this.isGrounded = false;
    this.isDucking = false;
    this.facing = 1;
    this.invincibleTimer = 0;
    this.starTimer = 0;
    this.animTimer = 0;
    this.animFrame = 0;
    this.isDead = false;
    this.slideOnFlag = false;
  }

  update(dt) {
    if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
    if (this.starTimer > 0) this.starTimer -= dt;

    if (this.slideOnFlag) {
      this.vy = 80;
      this.y += this.vy * dt;
      if (this.y >= 12 * TILE_SIZE) {
        this.y = 12 * TILE_SIZE;
        this.slideOnFlag = false;
        this.vx = 70; // walk into castle
      }
      return;
    }

    if (state === 'WINNING') {
      this.x += 70 * dt;
      this.animTimer += dt * 8;
      this.animFrame = Math.floor(this.animTimer) % 3;
      return;
    }

    const maxSpeed = keys.run ? 150 : 100;
    const accel = keys.run ? 440 : 320;
    const friction = 380;

    if (keys.left && !this.isDucking) {
      this.facing = -1;
      this.vx = Math.max(-maxSpeed, this.vx - accel * dt);
    } else if (keys.right && !this.isDucking) {
      this.facing = 1;
      this.vx = Math.min(maxSpeed, this.vx + accel * dt);
    } else {
      if (this.vx > 0) this.vx = Math.max(0, this.vx - friction * dt);
      else if (this.vx < 0) this.vx = Math.min(0, this.vx + friction * dt);
    }

    if (keys.down && this.powerState > 0 && this.isGrounded) {
      this.isDucking = true;
      this.h = 20;
    } else {
      this.isDucking = false;
      this.h = this.powerState > 0 ? 28 : 16;
    }

    if (keys.jump && this.isGrounded && !this.jumpPressedLast) {
      this.vy = this.powerState > 0 ? -340 : -325;
      this.isGrounded = false;
      if (this.powerState > 0) sfx.superJump();
      else sfx.jump();
    }
    this.jumpPressedLast = keys.jump;

    // Fireball
    if (keys.run && !this.runPressedLast && this.powerState === 2 && fireballs.length < 3) {
      fireballs.push(new Fireball(this.x + this.facing * 10, this.y - 12, this.facing));
      sfx.fireball();
    }
    this.runPressedLast = keys.run;

    const gravity = (keys.jump && this.vy < 0) ? 650 : 980;
    this.vy += gravity * dt;

    // Collide X
    this.x += this.vx * dt;
    if (this.x < cameraX + 8) { this.x = cameraX + 8; this.vx = 0; }
    this.collideX();

    // Collide Y
    this.y += this.vy * dt;
    this.collideY();

    // Animation frame
    if (!this.isGrounded) {
      this.animFrame = 3;
    } else if (Math.abs(this.vx) > 5) {
      this.animTimer += dt * Math.abs(this.vx) * 0.08;
      this.animFrame = Math.floor(this.animTimer) % 3;
    } else {
      this.animFrame = 0;
    }

    // Flagpole touch check
    if (this.x >= flagPoleX - 8 && this.x <= flagPoleX + 8 && state === 'PLAYING') {
      triggerFlagpole();
    }

    // Pit fall
    if (this.y > VIEW_H + 30 && !this.isDead) {
      this.die();
    }

    // Camera follow
    if (this.x > cameraX + 105) {
      cameraX = Math.min((LEVELS[currentLevelIndex].length * TILE_SIZE) - VIEW_W, this.x - 105);
    }
  }

  collideX() {
    const leftTile = Math.floor((this.x - this.w / 2) / TILE_SIZE);
    const rightTile = Math.floor((this.x + this.w / 2) / TILE_SIZE);
    const topTile = Math.floor((this.y - this.h) / TILE_SIZE);
    const botTile = Math.floor((this.y - 1) / TILE_SIZE);

    for (let ty = topTile; ty <= botTile; ty++) {
      for (let tx = leftTile; tx <= rightTile; tx++) {
        if (isSolidTile(tx, ty)) {
          if (this.vx > 0) {
            this.x = tx * TILE_SIZE - this.w / 2;
            this.vx = 0;
          } else if (this.vx < 0) {
            this.x = (tx + 1) * TILE_SIZE + this.w / 2;
            this.vx = 0;
          }
        }
      }
    }
  }

  collideY() {
    const leftTile = Math.floor((this.x - this.w / 2 + 1) / TILE_SIZE);
    const rightTile = Math.floor((this.x + this.w / 2 - 1) / TILE_SIZE);
    const topTile = Math.floor((this.y - this.h) / TILE_SIZE);
    const botTile = Math.floor(this.y / TILE_SIZE);

    this.isGrounded = false;

    if (this.vy >= 0) {
      for (let tx = leftTile; tx <= rightTile; tx++) {
        if (isSolidTile(tx, botTile)) {
          this.y = botTile * TILE_SIZE;
          this.vy = 0;
          this.isGrounded = true;
          break;
        }
      }
    } else if (this.vy < 0) {
      for (let tx = leftTile; tx <= rightTile; tx++) {
        const hitBlock = getBlockAt(tx, topTile);
        if (hitBlock) {
          this.y = (topTile + 1) * TILE_SIZE + this.h;
          this.vy = 0;
          hitBlock.hit(this.powerState > 0);
          break;
        } else if (isSolidTile(tx, topTile)) {
          this.y = (topTile + 1) * TILE_SIZE + this.h;
          this.vy = 0;
          sfx.bump();
          break;
        }
      }
    }
  }

  powerUp(type) {
    if (type === 'MUSHROOM' && this.powerState === 0) {
      this.powerState = 1;
      this.h = 28;
    } else if (type === 'FLOWER') {
      this.powerState = 2;
      this.h = 28;
    } else if (type === 'STAR') {
      this.starTimer = 10.0;
    }
    this.invincibleTimer = 1.5;
    sfx.powerup();
    addScore(1000, this.x, this.y - 20);
  }

  takeHit() {
    if (this.invincibleTimer > 0 || this.starTimer > 0) return;
    if (this.powerState > 0) {
      this.powerState = 0;
      this.h = 16;
      this.invincibleTimer = 2.0;
      sfx.bump();
    } else {
      this.die();
    }
  }

  die() {
    if (this.isDead) return;
    this.isDead = true;
    state = 'DYING';
    sfx.die();
    this.vy = -340;
    lives--;
    livesEl.textContent = '❤️ ' + Math.max(0, lives);
    setTimeout(() => {
      if (lives > 0) respawn();
      else gameOver();
    }, 800);
  }

  draw() {
    if (this.invincibleTimer > 0 && Math.floor(performance.now() / 60) % 2 === 0) return;

    ctx.save();
    ctx.translate(Math.round(this.x - cameraX), Math.round(this.y));
    ctx.scale(this.facing, 1);

    const pxH = this.h;
    const pxW = this.w;
    const isBig = this.powerState > 0;
    const isFire = this.powerState === 2;

    // Colors
    let suitCol = isFire ? '#ffffff' : '#0038a8';
    let shirtCol = isFire ? '#e52521' : (isBig ? '#e52521' : '#e52521');

    if (this.starTimer > 0) {
      const starCycle = ['#ff0055', '#00ff88', '#00f0ff', '#ffd700'];
      suitCol = starCycle[Math.floor(performance.now() / 80) % starCycle.length];
    }

    // Overalls
    ctx.fillStyle = suitCol;
    ctx.fillRect(-pxW/2 + 2, -pxH + (isBig ? 12 : 8), pxW - 4, isBig ? 12 : 6);

    // Shirt & Cap
    ctx.fillStyle = shirtCol;
    ctx.fillRect(-pxW/2 + 1, -pxH, pxW - 2, isBig ? 10 : 7);
    ctx.fillRect(-pxW/2 + (this.facing > 0 ? 0 : 2), -pxH + 2, pxW + 2, 3);
    ctx.fillRect(-pxW/2 + 1, -pxH + (isBig ? 12 : 7), pxW - 2, isBig ? 8 : 4);

    // Face
    ctx.fillStyle = '#fcb888';
    ctx.fillRect(-pxW/2 + 3, -pxH + (isBig ? 6 : 4), pxW - 5, isBig ? 8 : 5);
    ctx.fillRect(pxW/2 - 2, -pxH + (isBig ? 8 : 5), 4, 3);
    ctx.fillStyle = '#000';
    ctx.fillRect(pxW/2 - 4, -pxH + (isBig ? 7 : 5), 2, 2);
    ctx.fillStyle = '#482400';
    ctx.fillRect(-pxW/2 + 2, -pxH + (isBig ? 10 : 7), pxW - 2, 2);

    // Shoes
    ctx.fillStyle = '#783400';
    if (this.animFrame === 3) {
      ctx.fillRect(-pxW/2, -3, 5, 3);
      ctx.fillRect(0, -5, 5, 3);
    } else if (this.animFrame === 1 || this.animFrame === 2) {
      ctx.fillRect(-pxW/2 - 1, -3, 6, 3);
      ctx.fillRect(1, -2, 6, 2);
    } else {
      ctx.fillRect(-pxW/2, -3, pxW, 3);
    }

    ctx.restore();
  }
}

let player = new Player();

/* ==========================================================================
   BLOCKS, ITEMS & FIREBALLS
   ========================================================================== */
class Block {
  constructor(tx, ty, type, content = 'COIN') {
    this.tx = tx;
    this.ty = ty;
    this.type = type; // 'Q', 'B', 'USED'
    this.content = content; // 'COIN', 'MUSHROOM', 'FLOWER', 'STAR'
    this.bumpY = 0;
    this.bumpVel = 0;
  }

  update(dt) {
    if (this.bumpY !== 0 || this.bumpVel !== 0) {
      this.bumpY += this.bumpVel * dt;
      this.bumpVel += 300 * dt;
      if (this.bumpY >= 0) {
        this.bumpY = 0;
        this.bumpVel = 0;
      }
    }
  }

  hit(isBig) {
    if (this.type === 'USED') {
      sfx.bump();
      return;
    }
    this.bumpY = -6;
    this.bumpVel = -80;

    if (this.type === 'Q') {
      this.type = 'USED';
      if (this.content === 'COIN') {
        sfx.coin();
        coins++;
        coinsEl.textContent = '🪙 ' + (coins < 10 ? '0' : '') + coins;
        addScore(200, this.tx * TILE_SIZE + 8, this.ty * TILE_SIZE - 8);
        spawnCoinParticle(this.tx * TILE_SIZE + 8, this.ty * TILE_SIZE);
      } else {
        sfx.powerupAppear();
        const type = (this.content === 'MUSHROOM' && player.powerState > 0) ? 'FLOWER' : this.content;
        items.push(new PowerItem(this.tx * TILE_SIZE, (this.ty - 1) * TILE_SIZE, type));
      }
    } else if (this.type === 'B') {
      if (isBig) {
        sfx.breakBrick();
        addScore(50, this.tx * TILE_SIZE + 8, this.ty * TILE_SIZE);
        shatterBrick(this.tx * TILE_SIZE, this.ty * TILE_SIZE);
        removeBlock(this.tx, this.ty);
      } else {
        sfx.bump();
      }
    }
  }

  draw() {
    const x = this.tx * TILE_SIZE - cameraX;
    const y = this.ty * TILE_SIZE + this.bumpY;
    if (x < -20 || x > VIEW_W + 20) return;

    if (this.type === 'Q') {
      ctx.fillStyle = '#fc9838';
      ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(x + 0.5, y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 2, y + 2, 2, 2);
      ctx.fillStyle = '#783400';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('?', x + 4, y + 12);
    } else if (this.type === 'B') {
      ctx.fillStyle = '#b84418';
      ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y + 7, TILE_SIZE, 1);
      ctx.fillRect(x + 7, y, 1, 7);
      ctx.fillRect(x + 4, y + 8, 1, 8);
    } else if (this.type === 'USED') {
      ctx.fillStyle = '#8c5838';
      ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(x + 0.5, y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
    }
  }
}

class PowerItem {
  constructor(x, y, type = 'MUSHROOM') {
    this.x = x + 8;
    this.y = y + 16;
    this.type = type;
    this.vx = type === 'STAR' ? 70 : 55;
    this.vy = -60;
    this.w = 14;
    this.h = 14;
  }

  update(dt) {
    this.vy += (this.type === 'STAR' ? 450 : 600) * dt;
    this.x += this.vx * dt;
    
    const tx = Math.floor((this.x + (this.vx > 0 ? this.w/2 : -this.w/2)) / TILE_SIZE);
    const ty = Math.floor((this.y - 4) / TILE_SIZE);
    if (isSolidTile(tx, ty)) {
      this.vx = -this.vx;
    }

    this.y += this.vy * dt;
    const botTx = Math.floor(this.x / TILE_SIZE);
    const botTy = Math.floor(this.y / TILE_SIZE);
    if (isSolidTile(botTx, botTy)) {
      this.y = botTy * TILE_SIZE;
      this.vy = this.type === 'STAR' ? -220 : 0;
    }

    if (Math.abs(player.x - this.x) < 14 && Math.abs(player.y - this.y) < 18) {
      player.powerUp(this.type);
      return true;
    }
    return false;
  }

  draw() {
    const px = Math.round(this.x - cameraX);
    const py = Math.round(this.y);

    if (this.type === 'MUSHROOM') {
      ctx.fillStyle = '#e52521';
      ctx.beginPath(); ctx.arc(px, py - 8, 7, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(px - 2, py - 11, 4, 4);
      ctx.fillStyle = '#fcd8a8';
      ctx.fillRect(px - 4, py - 6, 8, 6);
    } else if (this.type === 'FLOWER') {
      ctx.fillStyle = '#00c800';
      ctx.fillRect(px - 1, py - 6, 2, 6);
      ctx.fillStyle = '#ff7700';
      ctx.beginPath(); ctx.arc(px, py - 9, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px, py - 9, 3, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'STAR') {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(px, py - 7, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(px - 3, py - 8, 2, 3);
      ctx.fillRect(px + 1, py - 8, 2, 3);
    }
  }
}

class Fireball {
  constructor(x, y, dir) {
    this.x = x;
    this.y = y;
    this.vx = dir * 200;
    this.vy = 80;
    this.r = 4;
    this.life = 1.8;
  }

  update(dt) {
    this.life -= dt;
    if (this.life <= 0) return true;

    this.vy += 600 * dt;
    this.x += this.vx * dt;

    const tx = Math.floor((this.x + (this.vx > 0 ? this.r : -this.r)) / TILE_SIZE);
    const ty = Math.floor(this.y / TILE_SIZE);
    if (isSolidTile(tx, ty)) return true;

    this.y += this.vy * dt;
    const botTx = Math.floor(this.x / TILE_SIZE);
    const botTy = Math.floor((this.y + this.r) / TILE_SIZE);
    if (isSolidTile(botTx, botTy)) {
      this.y = botTy * TILE_SIZE - this.r;
      this.vy = -180; // bounce
    }

    // Check hit enemy
    for (let e of enemies) {
      if (!e.isDead && Math.abs(e.x - this.x) < 14 && Math.abs(e.y - this.y) < 14) {
        e.isDead = true;
        sfx.kick();
        addScore(200, e.x, e.y);
        return true;
      }
    }
    return false;
  }

  draw() {
    const px = Math.round(this.x - cameraX);
    const py = Math.round(this.y);
    ctx.fillStyle = '#ff7700';
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
  }
}

class Goomba {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = -35;
    this.vy = 0;
    this.w = 14;
    this.h = 14;
    this.isDead = false;
    this.deadTimer = 0;
  }

  update(dt) {
    if (this.isDead) {
      this.deadTimer += dt;
      return this.deadTimer > 0.4;
    }

    if (this.x > cameraX + VIEW_W + 40) return false;
    if (this.x < cameraX - 40) return true;

    this.vy += 650 * dt;
    this.x += this.vx * dt;

    const tx = Math.floor((this.x + (this.vx > 0 ? this.w/2 : -this.w/2)) / TILE_SIZE);
    const ty = Math.floor((this.y - 6) / TILE_SIZE);
    if (isSolidTile(tx, ty)) this.vx = -this.vx;

    this.y += this.vy * dt;
    const botTx = Math.floor(this.x / TILE_SIZE);
    const botTy = Math.floor(this.y / TILE_SIZE);
    if (isSolidTile(botTx, botTy)) {
      this.y = botTy * TILE_SIZE;
      this.vy = 0;
    }

    // Player touch
    if (Math.abs(player.x - this.x) < 12 && Math.abs(player.y - this.y) < 14) {
      if (player.starTimer > 0) {
        this.isDead = true;
        sfx.kick();
        addScore(200, this.x, this.y);
      } else if (player.vy > 0 && player.y < this.y - 4) {
        this.isDead = true;
        player.vy = -220;
        sfx.stomp();
        addScore(100, this.x, this.y - 12);
      } else {
        player.takeHit();
      }
    }
    return false;
  }

  draw() {
    const px = Math.round(this.x - cameraX);
    const py = Math.round(this.y);
    if (this.isDead) {
      ctx.fillStyle = '#984400';
      ctx.fillRect(px - 7, py - 4, 14, 4);
      return;
    }

    ctx.fillStyle = '#984400';
    ctx.beginPath(); ctx.arc(px, py - 8, 7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fcd8a8';
    ctx.fillRect(px - 4, py - 6, 8, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(px - 6, py - 2, 4, 2);
    ctx.fillRect(px + 2, py - 2, 4, 2);
  }
}

class Koopa {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = -30;
    this.vy = 0;
    this.w = 14;
    this.h = 22;
    this.state = 'WALK';
  }

  update(dt) {
    if (this.x > cameraX + VIEW_W + 40) return false;
    if (this.x < cameraX - 40) return true;

    this.vy += 650 * dt;
    this.x += this.vx * dt;

    const tx = Math.floor((this.x + (this.vx > 0 ? this.w/2 : -this.w/2)) / TILE_SIZE);
    const ty = Math.floor((this.y - 6) / TILE_SIZE);
    if (isSolidTile(tx, ty)) {
      this.vx = -this.vx;
      if (this.state === 'SLIDE') sfx.bump();
    }

    this.y += this.vy * dt;
    const botTx = Math.floor(this.x / TILE_SIZE);
    const botTy = Math.floor(this.y / TILE_SIZE);
    if (isSolidTile(botTx, botTy)) {
      this.y = botTy * TILE_SIZE;
      this.vy = 0;
    }

    if (this.state === 'SLIDE') {
      for (let e of enemies) {
        if (e !== this && !e.isDead && Math.abs(e.x - this.x) < 14 && Math.abs(e.y - this.y) < 14) {
          e.isDead = true;
          sfx.kick();
          addScore(200, e.x, e.y);
        }
      }
    }

    if (Math.abs(player.x - this.x) < 14 && Math.abs(player.y - this.y) < 16) {
      if (player.starTimer > 0) {
        this.isDead = true;
        sfx.kick();
        addScore(400, this.x, this.y);
      } else if (player.vy > 0 && player.y < this.y - 6) {
        player.vy = -230;
        if (this.state === 'WALK') {
          this.state = 'SHELL';
          this.vx = 0;
          this.h = 14;
          sfx.stomp();
          addScore(100, this.x, this.y);
        } else if (this.state === 'SHELL' || this.state === 'SLIDE') {
          this.state = 'SLIDE';
          this.vx = (player.x < this.x ? 180 : -180);
          sfx.kick();
          addScore(400, this.x, this.y);
        }
      } else {
        if (this.state === 'SHELL' && this.vx === 0) {
          this.state = 'SLIDE';
          this.vx = (player.x < this.x ? 180 : -180);
          sfx.kick();
          addScore(400, this.x, this.y);
        } else {
          player.takeHit();
        }
      }
    }
    return false;
  }

  draw() {
    const px = Math.round(this.x - cameraX);
    const py = Math.round(this.y);

    if (this.state === 'WALK') {
      ctx.fillStyle = '#00c800';
      ctx.beginPath(); ctx.arc(px, py - 10, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fcd8a8';
      ctx.beginPath(); ctx.arc(px + (this.vx > 0 ? 5 : -5), py - 18, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff7700';
      ctx.fillRect(px - 5, py - 3, 10, 3);
    } else {
      ctx.fillStyle = '#00c800';
      ctx.beginPath(); ctx.arc(px, py - 7, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(px - 3, py - 9, 6, 4);
    }
  }
}

/* ==========================================================================
   LEVEL BUILDER FOR 20 LEVELS
   ========================================================================== */
function buildLevel(lvlIndex) {
  const lvl = LEVELS[lvlIndex];
  currentTheme = THEMES[lvl.theme] || THEMES.GRASS;
  const worldW = lvl.length;
  
  tileMap = Array.from({ length: WORLD_TILES_H }, () => Array(worldW).fill(0));
  blocks = [];
  enemies = [];
  items = [];
  fireballs = [];
  particles = [];
  floatingTexts = [];
  timeLeft = lvl.time;
  cameraX = 0;

  worldEl.textContent = lvl.world;
  timeEl.textContent = String(timeLeft);

  // Generate ground with pits
  const pitLocations = [];
  for (let p = 0; p < lvl.pits; p++) {
    const px = Math.floor(40 + (p + 1) * (worldW - 80) / (lvl.pits + 1));
    pitLocations.push(px, px + 1);
  }

  for (let x = 0; x < worldW; x++) {
    if (pitLocations.includes(x) && x < worldW - 30) continue;
    tileMap[12][x] = 1;
    tileMap[13][x] = 1;
  }

  // Add Pipes with guaranteed clearance (max height 2-3, no blocks overhead)
  const pipePositions = [];
  const numPipes = Math.floor(worldW / 36);
  for (let i = 0; i < numPipes; i++) {
    const px = Math.floor(26 + i * 34);
    if (!pitLocations.includes(px) && !pitLocations.includes(px + 1) && px < worldW - 40) {
      const h = (i % 2 === 0 ? 2 : 3); // 2 or 3 tiles tall (32px or 48px) - always jumpable!
      pipePositions.push(px, px + 1, px - 1, px + 2);
      for (let dy = 0; dy < h; dy++) {
        tileMap[12 - 1 - dy][px] = 2;
        tileMap[12 - 1 - dy][px + 1] = 3;
      }
    }
  }

  // Add Mystery & Brick blocks ONLY where no pipes or pits are nearby
  for (let x = 16; x < worldW - 35; x += 10) {
    if (!pitLocations.includes(x) && !pitLocations.includes(x+1) && !pitLocations.includes(x+2) && !pipePositions.includes(x) && !pipePositions.includes(x+1) && !pipePositions.includes(x+2)) {
      blocks.push(new Block(x, 8, 'Q', (x % 20 === 0 ? 'MUSHROOM' : (x % 30 === 0 ? 'STAR' : 'COIN'))));
      blocks.push(new Block(x + 1, 8, 'B'));
      blocks.push(new Block(x + 2, 8, 'B'));
      if (x % 20 === 0) blocks.push(new Block(x + 1, 4, 'B'));
    }
  }

  // End Stairs
  const stairsStart = worldW - 32;
  for (let h = 1; h <= 6; h++) {
    const x = stairsStart + h;
    for (let y = 12 - h; y < 12; y++) {
      tileMap[y][x] = 4;
    }
  }

  // Flagpole
  flagPoleX = (worldW - 20) * TILE_SIZE;
  const flagTx = worldW - 20;
  for (let y = 3; y < 12; y++) {
    tileMap[y][flagTx] = 5;
  }

  // Castle at the end
  castleX = (worldW - 12) * TILE_SIZE;

  // Spawn Enemies
  for (let e = 0; e < lvl.enemies; e++) {
    const ex = (24 + (e + 1) * (worldW - 60) / lvl.enemies) * TILE_SIZE;
    if (e % 3 === 0) enemies.push(new Koopa(ex, 12 * TILE_SIZE));
    else enemies.push(new Goomba(ex, 12 * TILE_SIZE));
  }
}

function isSolidTile(tx, ty) {
  if (tx < 0 || ty < 0 || ty >= WORLD_TILES_H) return false;
  if (tileMap && tileMap[ty] && tileMap[ty][tx] > 0 && tileMap[ty][tx] !== 5) return true;
  return blocks.some(b => b.tx === tx && b.ty === ty);
}

function getBlockAt(tx, ty) {
  return blocks.find(b => b.tx === tx && b.ty === ty);
}

function removeBlock(tx, ty) {
  blocks = blocks.filter(b => !(b.tx === tx && b.ty === ty));
}

function addScore(pts, x, y) {
  score += pts;
  scoreEl.textContent = String(score).padStart(6, '0');
  floatingTexts.push({ text: `+${pts}`, x, y, vy: -30, life: 0.6 });
}

function spawnCoinParticle(x, y) {
  particles.push({ type: 'COIN', x, y, vy: -120, life: 0.4 });
}

function shatterBrick(x, y) {
  const dirs = [[-40, -120], [40, -120], [-30, -60], [30, -60]];
  for (let d of dirs) {
    particles.push({ type: 'BRICK', x: x + 8, y: y + 8, vx: d[0], vy: d[1], life: 0.8 });
  }
}

function triggerFlagpole() {
  state = 'WINNING';
  player.slideOnFlag = true;
  player.vx = 0;
  player.x = flagPoleX;
  sfx.flagpole();

  const timeBonus = timeLeft * 50;
  addScore(timeBonus + 1000, flagPoleX, 80);

  setTimeout(() => {
    sfx.winLevel();
    if (currentLevelIndex + 1 < LEVELS.length) {
      unlockedLevel = Math.max(unlockedLevel, currentLevelIndex + 2);
      try { localStorage.setItem('mario_unlocked_lvl', String(unlockedLevel)); } catch(e){}
      renderLevelGrid();
    }
  }, 1800);

  setTimeout(() => {
    if (currentLevelIndex + 1 < LEVELS.length) {
      loadLevel(currentLevelIndex + 1);
    } else {
      // Game completely finished!
      showMenu('🏆 ALLE 20 LEVEL GESCHAFFT!', 'Glückwunsch! Du bist der wahre Goetschi-Champion!');
    }
  }, 3800);
}

/* ==========================================================================
   RENDER & GAME LOOP
   ========================================================================== */
let lastT = performance.now();
let secondTimer = 0;

function loop(t) {
  const dt = Math.min(0.04, (t - lastT) / 1000);
  lastT = t;

  if (state === 'PLAYING' || state === 'WINNING') {
    player.update(dt);
    blocks.forEach(b => b.update(dt));
    items = items.filter(it => !it.update(dt));
    enemies = enemies.filter(e => !e.update(dt));
    fireballs = fireballs.filter(fb => !fb.update(dt));

    if (state === 'PLAYING') {
      secondTimer += dt;
      if (secondTimer >= 1.0) {
        secondTimer -= 1.0;
        timeLeft = Math.max(0, timeLeft - 1);
        timeEl.textContent = String(timeLeft);
        if (timeLeft <= 0) player.die();
      }
    }
  } else if (state === 'DYING') {
    player.vy += 980 * dt;
    player.y += player.vy * dt;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.vx) p.x += p.vx * dt;
    if (p.vy) { p.y += p.vy * dt; p.vy += 450 * dt; }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.life -= dt;
    ft.y += ft.vy * dt;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // DRAW
  ctx.save();
  ctx.scale(scale, scale);

  ctx.fillStyle = currentTheme.bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  drawBackground();
  drawTiles();
  drawCastle();
  blocks.forEach(b => b.draw());
  items.forEach(it => it.draw());
  enemies.forEach(e => e.draw());
  fireballs.forEach(fb => fb.draw());
  player.draw();
  drawFX();

  ctx.restore();
  requestAnimationFrame(loop);
}

function drawBackground() {
  ctx.fillStyle = '#ffffff';
  const cloudXs = [40, 160, 320, 520, 780, 1100, 1500, 1900, 2400];
  for (let cx of cloudXs) {
    const rx = cx - cameraX * 0.4;
    if (rx > -60 && rx < VIEW_W + 60) {
      ctx.beginPath(); ctx.arc(rx, 45, 12, 0, Math.PI * 2); ctx.arc(rx + 14, 40, 15, 0, Math.PI * 2); ctx.arc(rx + 28, 45, 12, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.fillStyle = currentTheme.hill;
  const hillXs = [60, 280, 560, 900, 1300, 1700, 2200];
  for (let hx of hillXs) {
    const rx = hx - cameraX * 0.6;
    if (rx > -80 && rx < VIEW_W + 80) {
      ctx.beginPath(); ctx.arc(rx, 192, 45, Math.PI, 0); ctx.fill();
    }
  }
}

function drawTiles() {
  if (!tileMap || tileMap.length === 0) return;
  const startTx = Math.max(0, Math.floor(cameraX / TILE_SIZE));
  const endTx = Math.min(tileMap[0].length - 1, Math.ceil((cameraX + VIEW_W) / TILE_SIZE));

  for (let ty = 0; ty < WORLD_TILES_H; ty++) {
    if (!tileMap[ty]) continue;
    for (let tx = startTx; tx <= endTx; tx++) {
      const t = tileMap[ty][tx];
      const x = tx * TILE_SIZE - cameraX;
      const y = ty * TILE_SIZE;

      if (t === 1) {
        ctx.fillStyle = currentTheme.ground;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = currentTheme.grass;
        ctx.fillRect(x, y, TILE_SIZE, 3);
      } else if (t === 2 || t === 3) {
        ctx.fillStyle = currentTheme.pipe;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = t === 2 ? '#a0ffb0' : '#004810';
        ctx.fillRect(x + (t === 2 ? 2 : 12), y, 2, TILE_SIZE);
      } else if (t === 4) {
        ctx.fillStyle = currentTheme.ground;
        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x + 0.5, y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
      } else if (t === 5) {
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 7, y, 2, TILE_SIZE);
        if (ty === 3) {
          ctx.fillStyle = '#00c800';
          ctx.beginPath(); ctx.arc(x + 8, y + 2, 4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#00ff88';
          ctx.beginPath(); ctx.moveTo(x + 7, y + 4); ctx.lineTo(x - 12, y + 10); ctx.lineTo(x + 7, y + 16); ctx.fill();
        }
      }
    }
  }
}

function drawCastle() {
  const cx = castleX - cameraX;
  if (cx < -80 || cx > VIEW_W + 80) return;

  ctx.fillStyle = '#607088';
  ctx.fillRect(cx, 12 * TILE_SIZE - 48, 64, 48);
  ctx.fillStyle = '#405068';
  ctx.fillRect(cx + 8, 12 * TILE_SIZE - 64, 48, 16); // Upper tower
  // Door
  ctx.fillStyle = '#000';
  ctx.fillRect(cx + 24, 12 * TILE_SIZE - 24, 16, 24);
  // Battlements
  for (let b = 0; b < 4; b++) {
    ctx.fillRect(cx + b * 16, 12 * TILE_SIZE - 52, 8, 6);
  }
}

function drawFX() {
  for (let p of particles) {
    const rx = p.x - cameraX;
    if (p.type === 'COIN') {
      ctx.fillStyle = '#fcd828';
      ctx.beginPath(); ctx.arc(rx, p.y, 4, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'BRICK') {
      ctx.fillStyle = '#b84418';
      ctx.fillRect(rx - 3, p.y - 3, 6, 6);
    }
  }

  for (let ft of floatingTexts) {
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x - cameraX - 8, ft.y);
    ctx.shadowBlur = 0;
  }
}

/* ==========================================================================
   LEVEL MANAGEMENT & MENU
   ========================================================================== */
function renderLevelGrid() {
  levelGrid.innerHTML = LEVELS.map((lvl, idx) => {
    const isLocked = idx + 1 > unlockedLevel;
    const theme = THEMES[lvl.theme] || THEMES.GRASS;
    return `
    <div class="lvl-card ${isLocked ? 'locked' : ''}" data-idx="${idx}">
      <span class="world-name">${lvl.world}</span>
      <span class="num">${idx + 1}</span>
      <span class="theme-dot" style="background:${theme.dot}"></span>
    </div>`;
  }).join('');

  document.querySelectorAll('.lvl-card:not(.locked)').forEach(card => {
    card.addEventListener('click', () => {
      const idx = parseInt(card.getAttribute('data-idx'), 10);
      loadLevel(idx);
    });
  });
}

function loadLevel(idx) {
  initAudio();
  currentLevelIndex = idx;
  buildLevel(idx);
  player = new Player();
  state = 'PLAYING';
  overlay.style.display = 'none';
}

function respawn() {
  cameraX = Math.max(0, player.x - 60);
  player = new Player();
  player.x = cameraX + 30;
  player.y = 12 * TILE_SIZE;
  state = 'PLAYING';
}

function gameOver() {
  state = 'GAMEOVER';
  lives = 3;
  livesEl.textContent = '❤️ 3';
  showMenu('GAME OVER', 'Alle Leben verloren. Wähle ein freigeschaltetes Level!');
}

function showMenu(title, subtitle) {
  state = 'OVERLAY';
  renderLevelGrid();
  overlay.querySelector('.logo').textContent = title || 'SUPER GOETSCHI BROS';
  overlay.querySelector('.subtitle').textContent = subtitle || '20 Level Abenteuer über 5 Welten';
  overlay.style.display = 'flex';
}

function toggleAudio() {
  soundEnabled = !soundEnabled;
  audioBtn.textContent = soundEnabled ? '🔊' : '🔇';
}

function togglePause() {
  if (state === 'PLAYING') {
    state = 'PAUSED';
    pauseBtn.textContent = '▶';
  } else if (state === 'PAUSED') {
    state = 'PLAYING';
    pauseBtn.textContent = '⏸';
  }
}

startBtn.addEventListener('click', () => loadLevel(0));
levelSelectBtn.addEventListener('click', () => showMenu('LEVEL WAHL', 'Wähle deine Welt'));
audioBtn.addEventListener('click', toggleAudio);
pauseBtn.addEventListener('click', togglePause);

// Initialize level grid and start render loop
renderLevelGrid();
buildLevel(0);
requestAnimationFrame(loop);

/* ==========================================================================
   INPUT HANDLING (TOUCH & KEYBOARD)
   ========================================================================== */
window.addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); keys.left = true; }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); keys.right = true; }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); keys.down = true; }
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') { e.preventDefault(); keys.jump = true; }
  else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX' || e.code === 'KeyF') { keys.run = true; }
  else if (e.code === 'KeyM') { toggleAudio(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); }
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'KeyZ') keys.jump = false;
  else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX' || e.code === 'KeyF') keys.run = false;
});

function bindButton(el, keyName) {
  const start = (e) => {
    e.preventDefault(); e.stopPropagation();
    initAudio();
    el.classList.add('active');
    keys[keyName] = true;
  };
  const stop = (e) => {
    e.preventDefault();
    el.classList.remove('active');
    keys[keyName] = false;
  };
  el.addEventListener('touchstart', start, { passive: false });
  el.addEventListener('touchend', stop, { passive: false });
  el.addEventListener('touchcancel', stop, { passive: false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
}

bindButton(document.getElementById('btnLeft'), 'left');
bindButton(document.getElementById('btnRight'), 'right');
bindButton(document.getElementById('btnDown'), 'down');
bindButton(document.getElementById('btnA'), 'jump');
bindButton(document.getElementById('btnB'), 'run');


  if (window.GoetschiAIPilot) {
    window.GoetschiAIPilot.register({
      interval: 50,
      getObs: function() {
        if (state !== 'PLAYING' || !player) return null;
        const px = player.x, py = player.y;
        const pvx = player.vx, pvy = player.vy;
        const grounded = player.grounded ? 1.0 : 0.0;
        const pState = player.fire ? 1.0 : (player.big ? 0.5 : 0.0);
        const aliveEnemies = (enemies || []).filter(e => e.alive && e.x >= px - 60).sort((a,b) => Math.abs(a.x - px) - Math.abs(b.x - px));
        const e1_dx = aliveEnemies[0] ? (aliveEnemies[0].x - px) / 200.0 : 2.0;
        const e1_dy = aliveEnemies[0] ? (aliveEnemies[0].y - py) / 200.0 : 0.0;
        const e2_dx = aliveEnemies[1] ? (aliveEnemies[1].x - px) / 200.0 : 2.0;
        const e2_dy = aliveEnemies[1] ? (aliveEnemies[1].y - py) / 200.0 : 0.0;
        return [
          (px % 500.0) / 250.0 - 1.0,
          (py / 400.0) * 2 - 1.0,
          Math.max(-2, Math.min(2, pvx / 5.0)),
          Math.max(-2, Math.min(2, pvy / 10.0)),
          grounded,
          pState,
          Math.max(-2, Math.min(2, e1_dx)), Math.max(-2, Math.min(2, e1_dy)),
          Math.max(-2, Math.min(2, e2_dx)), Math.max(-2, Math.min(2, e2_dy)),
          grounded, 0, 0, 1, 1, 0,
          (px - cameraX) / 300.0 - 1.0,
          Math.max(0, timeLeft / 300.0)
        ];
      },
      applyAction: function(act) {
        if (state !== 'PLAYING') {
          loadLevel(currentLevelIndex || 0);
          return;
        }
        keys.left = (act === 1 || act === 5);
        keys.right = (act === 2 || act === 4);
        keys.jump = (act === 3 || act === 4 || act === 5);
        keys.run = (act === 2 || act === 4);
      },
      isDead: function() {
        return state === 'GAMEOVER' || state === 'OVERLAY' || state === 'DYING';
      },
      restart: function() {
        if (state === 'GAMEOVER') restartGame();
        else loadLevel(currentLevelIndex || 0);
      },
      onStop: function() {
        if (typeof keys !== 'undefined') {
          keys.left = false; keys.right = false; keys.jump = false; keys.run = false;
        }
      }
    });
  }

})();
</script>
