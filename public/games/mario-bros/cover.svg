<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Super Goetschi Bros">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c94fc"/>
      <stop offset="70%" stop-color="#70a6ff"/>
      <stop offset="100%" stop-color="#99c2ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9" filter="url(#shadow)">
    <circle cx="140" cy="110" r="30"/>
    <circle cx="170" cy="100" r="36"/>
    <circle cx="205" cy="110" r="28"/>
    <rect x="135" y="110" width="75" height="28" rx="6"/>

    <circle cx="620" cy="90" r="28"/>
    <circle cx="650" cy="80" r="34"/>
    <circle cx="685" cy="90" r="26"/>
    <rect x="615" y="90" width="75" height="26" rx="6"/>
  </g>

  <!-- Hills -->
  <ellipse cx="220" cy="420" rx="180" ry="110" fill="#00a800"/>
  <ellipse cx="220" cy="420" rx="170" ry="100" fill="#00c800"/>
  <ellipse cx="660" cy="430" rx="140" ry="90" fill="#00a800"/>

  <!-- Ground -->
  <rect x="0" y="400" width="800" height="100" fill="#c84c0c"/>
  <rect x="0" y="400" width="800" height="16" fill="#00c800"/>
  <rect x="0" y="416" width="800" height="4" fill="#008800"/>

  <!-- Green Warp Pipe -->
  <g filter="url(#shadow)">
    <rect x="640" y="270" width="90" height="130" fill="#00a800" stroke="#000" stroke-width="3"/>
    <rect x="630" y="240" width="110" height="36" rx="4" fill="#00c800" stroke="#000" stroke-width="3"/>
    <rect x="642" y="246" width="18" height="24" fill="#80ff80"/>
  </g>

  <!-- Question Blocks & Bricks -->
  <g filter="url(#shadow)">
    <!-- Brick -->
    <rect x="220" y="220" width="50" height="50" rx="4" fill="#b84418" stroke="#000" stroke-width="3"/>
    <line x1="220" y1="245" x2="270" y2="245" stroke="#000" stroke-width="2"/>
    <!-- Question Block -->
    <rect x="278" y="220" width="50" height="50" rx="4" fill="#fc9838" stroke="#000" stroke-width="3"/>
    <text x="303" y="258" font-family="monospace" font-weight="900" font-size="34" fill="#783400" text-anchor="middle">?</text>
    <rect x="282" y="224" width="6" height="6" fill="#fff" opacity="0.6"/>
    <!-- Brick -->
    <rect x="336" y="220" width="50" height="50" rx="4" fill="#b84418" stroke="#000" stroke-width="3"/>
    <!-- Question Block with Mushroom -->
    <rect x="394" y="220" width="50" height="50" rx="4" fill="#fc9838" stroke="#000" stroke-width="3"/>
    <text x="419" y="258" font-family="monospace" font-weight="900" font-size="34" fill="#783400" text-anchor="middle">?</text>
  </g>

  <!-- Super Mushroom emerging -->
  <g filter="url(#shadow)">
    <circle cx="419" cy="188" r="22" fill="#e52521" stroke="#000" stroke-width="2.5"/>
    <circle cx="412" cy="180" r="6" fill="#ffffff"/>
    <circle cx="428" cy="184" r="5" fill="#ffffff"/>
    <rect x="408" y="196" width="22" height="18" rx="4" fill="#fcd8a8" stroke="#000" stroke-width="2.5"/>
    <circle cx="414" cy="202" r="2" fill="#000"/>
    <circle cx="424" cy="202" r="2" fill="#000"/>
  </g>

  <!-- Mario / Goetschi Character Jumping -->
  <g filter="url(#shadow)">
    <!-- Body / Overalls -->
    <rect x="135" y="295" width="38" height="42" rx="6" fill="#0038a8"/>
    <!-- Red Shirt -->
    <circle cx="154" cy="290" r="18" fill="#e52521"/>
    <rect x="122" y="290" width="16" height="14" rx="4" fill="#e52521" transform="rotate(-30 130 297)"/>
    <circle cx="118" cy="285" r="8" fill="#ffffff" stroke="#000" stroke-width="2"/> <!-- White glove -->
    <rect x="168" y="270" width="16" height="14" rx="4" fill="#e52521" transform="rotate(45 176 277)"/>
    <circle cx="186" cy="265" r="8" fill="#ffffff" stroke="#000" stroke-width="2"/> <!-- White glove up -->
    
    <!-- Face & Cap -->
    <circle cx="154" cy="262" r="16" fill="#fcb888"/>
    <ellipse cx="164" cy="264" rx="7" ry="5" fill="#fcb888"/> <!-- Nose -->
    <circle cx="159" cy="258" r="3" fill="#000"/> <!-- Eye -->
    <path d="M 152 268 Q 165 272 174 266" stroke="#482400" stroke-width="5" stroke-linecap="round" fill="none"/> <!-- Moustache -->
    <path d="M 136 256 C 136 240, 172 238, 176 254 Z" fill="#e52521"/> <!-- Cap -->
    <rect x="146" y="250" width="30" height="7" rx="3" fill="#e52521"/> <!-- Cap Brim -->

    <!-- Brown Shoes -->
    <ellipse cx="130" cy="344" rx="14" ry="9" fill="#783400"/>
    <ellipse cx="174" cy="336" rx="14" ry="9" fill="#783400"/>
  </g>

  <!-- Goomba Enemy -->
  <g filter="url(#shadow)">
    <path d="M 520 365 C 520 330, 565 330, 565 365 Z" fill="#984400" stroke="#000" stroke-width="2.5"/>
    <rect x="528" y="365" width="28" height="16" fill="#fcd8a8" stroke="#000" stroke-width="2"/>
    <ellipse cx="522" cy="388" rx="12" ry="7" fill="#000"/>
    <ellipse cx="562" cy="388" rx="12" ry="7" fill="#000"/>
    <!-- Goomba Eyes & Eyebrows -->
    <path d="M 530 350 L 540 356" stroke="#000" stroke-width="3"/>
    <path d="M 554 350 L 544 356" stroke="#000" stroke-width="3"/>
    <ellipse cx="536" cy="360" rx="3" ry="5" fill="#fff"/>
    <ellipse cx="548" cy="360" rx="3" ry="5" fill="#fff"/>
    <circle cx="537" cy="360" r="2" fill="#000"/>
    <circle cx="547" cy="360" r="2" fill="#000"/>
  </g>

  <!-- Title Banner -->
  <g filter="url(#shadow)">
    <text x="400" y="75" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#ffe600" stroke="#d41400" stroke-width="4" letter-spacing="4">SUPER GOETSCHI BROS</text>
  </g>
</svg>
